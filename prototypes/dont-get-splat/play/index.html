    (free ? COLORS : [card.color]).forEach(target=>{
      const opt = {target, mud:muds[0]||null, mud2:muds[1]||null};
      if(isAction(opt.mud) && !(opt.mudArg = bestMudArg(sim, card, opt, 'mudArg', scoreFn))) return;
      if(isAction(opt.mud2) && !(opt.mudArg2 = bestMudArg(sim, card, opt, 'mudArg2', scoreFn))) return;
      opts.push(opt);
    });
  });
  return opts;
}
// Estimated end-of-round score for a simulated board (lower is better).
function plannerEval(sim){
  let total = 0;
  COLORS.forEach(c=>sim.stacks[c].forEach(cd=>{ total += topVal(cd); }));
  sim.virt.forEach(v=>{ total += v; });
  total -= sim.gift*PLANNER_GIFT_VALUE;
  total -= state.aiMudValue ? heldMudValue(sim) : sim.mud.length*PLANNER_MUD_VALUE;
  total += simCarry(sim);
  activeGoalCards().forEach(g=>{
    if(g.color) total += 1.5*sim.stacks[g.color].length;
    else if(g.custom==='splat_facedown') total += sim.virt.length + COLORS.reduce((a,c)=>a+sim.stacks[c].filter(cd=>cd.isStarter||cd.isBigSplat||cd.isFaceDown).length,0);
    else if(g.custom==='big_stacks') total += 1.5*COLORS.filter(c=>sim.stacks[c].length>=3).length;
  });
  return total;
}
function plannerDraftPick(player, pool, isLastTurn){
  const base = simBase(player);
  let best = null;
  pool.forEach(playCard=>{
    const rest = pool.filter(c=>c!==playCard);
    plannerPlayOptions(base, playCard, PLANNER_MUD_KEYS, plannerEval).forEach(opt=>{
      const s1 = plannerCloneSim(base);
      plannerSimPlay(s1, playCard, opt);
      // Last turn (or nothing left to store): judge this play on its own.
      const stores = (isLastTurn || rest.length===0) ? [null] : rest;
      stores.forEach(storeCard=>{
        let score = plannerEval(s1);
        if(storeCard){
          score = Infinity;
          plannerPlayOptions(s1, storeCard).forEach(opt2=>{
            const s2 = plannerCloneSim(s1);
            plannerSimPlay(s2, storeCard, opt2);
            score = Math.min(score, plannerEval(s2));
          });
        }
        score -= denialValue(player, playCard, isLastTurn) + (storeCard ? denialValue(player, storeCard, isLastTurn) : 0);
        if(!best || score<best.score) best = {score, playCard, storeCard, opt};
      });
    });
  });
  player._plan = {...best.opt};
  return {playCard:best.playCard, storeCard:best.storeCard, passCards:pool.filter(c=>c!==best.playCard && c!==best.storeCard)};
}

/* ---------- Destroyer: target-aware destruction ----------
   Uses the Planner's board simulation to measure how many points a card
   would actually flip or destroy on its own board (including via a Mud
   card), so it only chases destruction when there's something worth hitting. */
const DESTROYER_MIN_TARGET = 3;   // points a flip/destroy must remove to be worth chasing
const DESTROYER_MUD_COST = 2;     // extra points a Mud card must remove to be worth spending
function simBoardSum(sim){
  let t = 0;
  COLORS.forEach(c=>sim.stacks[c].forEach(cd=>{ t += topVal(cd); }));
  sim.virt.forEach(v=>{ t += v; });
  return t;
}
// The play (stack + optional Mud) that removes the most points from its own board.
function destroyerBestPlay(player, card){
  const base = simBase(player);
  const before = simBoardSum(base);
  let best = null;
  plannerPlayOptions(base, card, PLANNER_MUD_KEYS, s=>simBoardSum(s)+aiCarry(s)).forEach(opt=>{
    if(opt.mud==='facedown_instead' || opt.mud2==='facedown_instead') return; // hides the card but destroys nothing
    const s = plannerCloneSim(base);
    plannerSimPlay(s, card, opt);
    const removed = before + card.value - simBoardSum(s);
    const score = removed - [opt.mud, opt.mud2].filter(Boolean).length*DESTROYER_MUD_COST;
    if(!best || score>best.score) best = {score, removed, opt};
  });
  return best;
}
/* ---------- One-turn simulation for the other personalities ----------
   The Minimizer, Goal Chaser and Chaos each judge a card by what it would
   really do to their board (via the same simulation), scored their own way.
   Lower scores are better. */
const SIM_MUD_COST = 1;                 // points a Mud card must save to be worth spending
const GOAL_CHASER_EXPOSURE_WEIGHT = 5;  // Goal Chaser: dodging goals dominates card value
const SECONDARY_EXPOSURE_WEIGHT = 1;    // everyone else: a light nudge away from goals
const CHAOS_GIFT_WEIGHT = 2;            // Chaos: each point gifted is worth 2 of its own
// Passing a give card along is risky: whoever receives our hand always has
// us among the players their gifts hit (hands pass opposite to the pass
// token, so the receiver's token neighbour is us — and with the "both
// neighbours" option we're one of their neighbours anyway). Every AI except
// Chaos (which hoards gift cards regardless) counts keeping a give card —
// playing or storing it — as worth about half of what it would cost if the
// neighbour played it on us. Cards passed on the last turn are discarded,
// so there's nothing to deny then.
const DENIAL_WEIGHT = 0.5;
function incomingGiftEV(card){
  switch(card.ability){
    case 'give_starter_neighbours': return PLANNER_SPLAT_EV;
    case 'give_starter_neighbours_2': return 2*PLANNER_SPLAT_EV;
    case 'give_big_splat_neighbour': return bigSplatEV();
    case 'gift_mud': return state.aiMudValue ? -MUD_VALUE : 0;
    default: return 0;
  }
}
// With aiGiftCredit on, the Minimizer, Goal Chaser and Destroyer also count
// half of each point they gift to a neighbour as their own gain, the same
// way the Planner does (PLANNER_GIFT_VALUE).
function giftCredit(points){ return state.aiGiftCredit ? PLANNER_GIFT_VALUE*points : 0; }
function giftOutEV(card){ return giveTargetCount()*incomingGiftEV(card); }
function denialValue(player, card, noDenial){
  if(noDenial || !state.aiDenial || player.aiType==='chaos') return 0;
  return DENIAL_WEIGHT*incomingGiftEV(card);
}
// Which Mud cards each personality knows how to use. The Minimizer leans on
// the simple ones; Chaos re-fires gifts; the Goal Chaser uses anything. All
// of them can Rearrange or Move 2 (when aiMudAll is on).
const SIM_MUD_KEYS = {
  minimizer: ['facedown_instead','play_any','rearrange','move2'],
  goal: PLANNER_MUD_KEYS,
  chaos: ['use_under','play_any','rearrange','move2']
};
// How exposed a simulated board is to the active goal(s): its count toward
// each goal, plus a flat extra for being above zero (a count of 0 never
// earns the majority bonus).
function simGoalExposure(sim){
  let e = 0;
  activeGoalCards().forEach(g=>{
    let n;
    if(g.color) n = sim.stacks[g.color].length;
    else if(g.custom==='splat_facedown') n = sim.virt.length + COLORS.reduce((a,c)=>a+sim.stacks[c].filter(cd=>cd.isStarter||cd.isBigSplat||cd.isFaceDown).length,0);
    else if(g.custom==='big_stacks') n = COLORS.filter(c=>sim.stacks[c].length>=3).length;
    else if(g.singleColour) n = COLORS.filter(c=>{
      const s = sim.stacks[c];
      return s.length>0 && new Set(s.filter(cd=>cd.origin).map(cd=>cd.origin)).size===1;
    }).length;
    else n = 0;
    e += n + (n>0 ? 2 : 0);
  });
  return e;
}
const SIM_SCORERS = {
  minimizer: s => simBoardSum(s) + aiCarry(s) - heldMudValue(s) - giftCredit(s.gift) + SECONDARY_EXPOSURE_WEIGHT*simGoalExposure(s),
  goal: s => GOAL_CHASER_EXPOSURE_WEIGHT*simGoalExposure(s) + simBoardSum(s) + aiCarry(s) - heldMudValue(s) - giftCredit(s.gift),
  chaos: s => simBoardSum(s) + aiCarry(s) - heldMudValue(s) - CHAOS_GIFT_WEIGHT*s.gift + SECONDARY_EXPOSURE_WEIGHT*simGoalExposure(s)
};
// Best way to play this card this turn under the given scorer.
function simBestPlay(player, card, scoreFn, mudKeys){
  const base = simBase(player);
  let best = null;
  let noMud = null;
  plannerPlayOptions(base, card, mudKeys, scoreFn).forEach(opt=>{
    const s = plannerCloneSim(base);
    plannerSimPlay(s, card, opt);
    // With aiMudValue the scorer already counts the spent Mud cards' worth.
    const score = scoreFn(s) + (state.aiMudValue ? 0 : [opt.mud, opt.mud2].filter(Boolean).length*SIM_MUD_COST);
    if(!opt.mud && (noMud==null || score<noMud)) noMud = score;
    if(!best || score<best.score) best = {score, opt};
  });
  // Simulator bookkeeping: how many points spending the Mud card actually
  // saved over the best play without it (adding back the Mud's own cost).
  const spent = [best.opt.mud, best.opt.mud2].filter(Boolean).length;
  if(spent && noMud!=null) best.opt.mudSaved = noMud - best.score + (state.aiMudValue ? heldMudValue(base) - heldMudValue({mud:base.mud.slice(spent)}) : spent*SIM_MUD_COST);
  return best;
}
// Every AI resolves its card with the same pickers it simulated with.
function usesSimPlan(player){ return !player.isHuman; }

// Like chooseTarget, but lets AI callers supply a computed preferred pick —
// used only when that pick is actually among the offered options; falls
// back to chooseTarget's own behaviour (random for AI, modal for human).
async function chooseTargetSmart(player, title, options, aiPick){
  if(!player.isHuman && aiPick!=null && options.some(o=>o.value===aiPick)){
    await delay(320);
    return aiPick;
  }
  return chooseTarget(player, title, options);
}
// Decide what an AI plays/stores/passes-on this turn, given its drafting
// pool (hand + anything already in storage).
function aiDraftPick(player, pool, isLastTurn, noDenial){
  player._plan = null;
  const deny = c => denialValue(player, c, noDenial || isLastTurn);
  if(pool.length===0) return {playCard:null, storeCard:null, passCards:[]};
  if(player.aiType==='planner') return plannerDraftPick(player, pool, isLastTurn);
  if(pool.length===1){
    // Still worth simulating where/how to play it (Mud, free placement).
    if(SIM_SCORERS[player.aiType]){
      player._plan = {...simBestPlay(player, pool[0], SIM_SCORERS[player.aiType], SIM_MUD_KEYS[player.aiType]).opt};
    }
    return {playCard:pool[0], storeCard:null, passCards:[]};
  }
  // Nothing can be stored on the last turn, so each personality still plays
  // its own favourite card and the would-be storage card is passed on too.
  if(isLastTurn){
    const pick = aiDraftPick(player, pool, false, true);
    return {playCard:pick.playCard, storeCard:null, passCards:pool.filter(c=>c!==pick.playCard)};
  }
  const type = player.aiType;
  if(type==='goal'){
    // Dodging the active goal(s) comes first (heavily weighted exposure);
    // the card's real effect on its total only breaks near-ties. It stores
    // the next-safest card.
    const ranked = pool.map(c=>({c, ...simBestPlay(player, c, SIM_SCORERS.goal, SIM_MUD_KEYS.goal)})).sort((a,b)=>(a.score-deny(a.c))-(b.score-deny(b.c)));
    player._plan = {...ranked[0].opt};
    return {playCard:ranked[0].c, storeCard:ranked[1].c, passCards:ranked.slice(2).map(r=>r.c)};
  }
  if(type==='destroyer'){
    // Chases destruction whenever there's a good target: any card that would
    // flip/destroy at least DESTROYER_MIN_TARGET points beats every card that
    // wouldn't, and the bigger the haul the better. With no good target it
    // just plays its lowest card, and keeps a destroy card stored for later.
    // goalSafetyDelta is still a light secondary nudge.
    const plays = new Map(pool.map(c=>[c, destroyerBestPlay(player, c)]));
    // Worth of the Mud a gain-Mud card would add (up to the hand limit).
    const mudGain = c => {
      if(!state.aiMudValue) return 0;
      const n = c.ability==='gain_mud' ? 1 : c.ability==='gain_mud_2' ? 2 : 0;
      const held = player.mudHand.map(m=>m.key);
      const after = held.concat(Array(Math.max(0, Math.min(n, MUD_HAND_LIMIT - held.length))).fill('unknown'));
      return heldMudValue({mud:after}) - heldMudValue({mud:held});
    };
    const desire = c => {
      const removed = plays.get(c).removed;
      return (removed>=DESTROYER_MIN_TARGET ? 100+removed : 0) - c.value + mudGain(c) + giftCredit(giftOutEV(c)) + goalSafetyDelta(player,c)*GOAL_AWARENESS_SECONDARY + deny(c);
    };
    const storeDesire = c => (DESTROY_ABILITY_STRENGTH[c.ability] ? 10 - c.value*0.5 : -c.value + mudGain(c) + giftCredit(giftOutEV(c))) + deny(c);
    const playCard = pool.reduce((a,b)=> desire(b)>desire(a) ? b : a);
    const rest = pool.filter(c=>c!==playCard);
    const storeCard = rest.reduce((a,b)=> storeDesire(b)>storeDesire(a) ? b : a);
    const best = plays.get(playCard);
    player._plan = best.removed>=DESTROYER_MIN_TARGET ? {...best.opt} : null;
    return {playCard, storeCard, passCards: rest.filter(c=>c!==storeCard)};
  }
  if(type==='chaos'){
    // Plays give-to-neighbour cards above almost anything else — each point
    // gifted counts double its own cost, so it'll eat a bad number to send a
    // big gift (and uses Mud's "use the ability underneath" to send one again).
    // It hoards the biggest gift card in storage, otherwise the next-best card.
    const ranked = pool.map(c=>({c, ...simBestPlay(player, c, SIM_SCORERS.chaos, SIM_MUD_KEYS.chaos)})).sort((a,b)=>a.score-b.score);
    player._plan = {...ranked[0].opt};
    const rest = ranked.slice(1).map(r=>r.c);
    const gifts = rest.filter(c=>GIVE_ABILITY_STRENGTH[c.ability] && c.ability!=='gift_mud');
    const storeCard = gifts.length>0 ? gifts.reduce((a,b)=> GIVE_ABILITY_STRENGTH[b.ability]>GIVE_ABILITY_STRENGTH[a.ability] ? b : a) : rest[0];
    return {playCard:ranked[0].c, storeCard, passCards:rest.filter(c=>c!==storeCard)};
  }
  // minimizer (default/baseline): plays whichever card leaves its total
  // lowest once its ability resolves, stores the next-lowest and passes the
  // rest (its worst cards) along. Its only Mud tricks are the simple ones:
  // hide a bad card face down, or drop a card somewhere harmless.
  const ranked = pool.map(c=>({c, ...simBestPlay(player, c, SIM_SCORERS.minimizer, SIM_MUD_KEYS.minimizer)})).sort((a,b)=>(a.score-deny(a.c))-(b.score-deny(b.c)));
  player._plan = {...ranked[0].opt};
  return {playCard:ranked[0].c, storeCard:ranked[1].c, passCards:ranked.slice(2).map(r=>r.c)};
}

/* ============================= SETUP ============================= */
function makePlayer(id,name,isHuman,aiType){
  const stacks={}; COLORS.forEach(c=>{stacks[c]=[];});
  return {id,name,isHuman,aiType:aiType||null,hand:[],mudHand:[],stacks,stored:null,total:0,selected:null};
}
function initGame(numAI, aiTypeChoices){
  const players=[makePlayer(0,'You',true,null)];
  // Each AI opponent gets the personality picked for it at the menu, or an
  // independently random one (with replacement — a game can easily deal out
  // two or more of the same type) wherever a slot was left on "Random".
  for(let i=1;i<=numAI;i++){
    const choice = aiTypeChoices && aiTypeChoices[i-1];
    const aiType = (choice && choice!=='random') ? choice : AI_TYPES[Math.floor(Math.random()*AI_TYPES.length)];
    players.push(makePlayer(i,'AI '+i,false,aiType));
  }
  state.starterDeck = buildStarterDeck();
  state.bigSplatDeck = buildBigSplatDeck();
  // Players start with 3 Splat cards, or 2 under the "give to both
  // neighbours" option, which hands out far more Splats during play.
  const startingSplats = state.newLineup ? 2 : 3;
  players.forEach(p=>{
    for(let i=0;i<startingSplats;i++){
      const s = randomStarter();
      p.stacks[s.color].push(s);
    }
  });
  state.players = players;
  state.deck = buildMainDeck();
  state.discard = [];
  state.scoringDeck = shuffle([...SCORING_POOL]);
  state.round = 0;
  state.log = [];
  state.phase = 'setup';
  // The pass-direction token is flipped randomly before the first round,
  // then alternates sides every round after that.
  state.passDirectionBase = Math.random()<0.5 ? 'right' : 'left';
  state.passDirection = state.passDirectionBase;
}

/* ============================= MODAL / TARGETING ============================= */
function chooseOption(title, options, player){
  if(player && !player.isHuman) return Promise.resolve(netFallbackOption(options));
  if(player && player.remote) return netAsk(player, {kind:'option', title, options});
  return new Promise(resolve=>{
    modalResolver = resolve;
    state.modal = {title, options};
    render();
  }).then(val=>{
    if(val==='__UNDO__') throw new UndoSignal();
    return val;
  });
}
function onModalChoiceIndex(i){
  const val = state.modal.options[i].value;
  state.modal = null;
  const r = modalResolver; modalResolver = null;
  render();
  if(r) r(val);
}
async function chooseTarget(player, title, options){
  if(!options || options.length===0) return null;
  if(!player.isHuman){
    await delay(320);
    return options[Math.floor(Math.random()*options.length)].value;
  }
  return await chooseOption(title, options, player);
}
// kind: 'play', 'keep' or 'mud' — sets the confirm popup's wording. A Mud
// pick can also be skipped ("Play normally"), which resolves with -1.
function waitForPoolPick(promptText, eligibleCards, kind, player){
  if(player && !player.isHuman) return Promise.resolve(kind==='mud' ? -1 : eligibleCards[0].uid);
  if(player && player.remote) return netAsk(player, {kind:'pick', prompt:promptText, pickKind:kind||'play', uids:eligibleCards.map(c=>c.uid)});
  return new Promise(resolve=>{
    state.pickPrompt = promptText;
    state.pickKind = kind || 'play';
    state.pickableUids = eligibleCards.map(c=>c.uid);
    state.pickResolve = resolve;
    render();
  }).then(val=>{
    if(val==='__UNDO__') throw new UndoSignal();
    return val;
  });
}
function onPoolCardClick(uid){
  if(!state.pickResolve) return;
  if(!state.pickableUids.includes(uid)) return;
  const r = state.pickResolve;
  state.pickResolve = null;
  state.pickableUids = [];
  state.pickPrompt = '';
  render();
  r(uid);
}
function onPoolSkip(){
  if(!state.pickResolve || state.pickKind!=='mud') return;
  const r = state.pickResolve;
  state.pickResolve = null; state.pickableUids = []; state.pickPrompt = ''; state.cardZoom = null;
  render();
  r(-1);
}
// Tapping a card opens it large in a popup (touch screens have no hover
// preview). When the card can be picked right now, the popup also confirms
// the play / keep, so a stray tap never commits a card.
function findCardByUid(uid){
  for(const p of state.players){
    const c = p.hand.find(c=>c.uid===uid) || p.mudHand.find(m=>m.uid===uid) || (p.stored && p.stored.uid===uid ? p.stored : null)
      || COLORS.map(col=>p.stacks[col].find(c=>c.uid===uid)).find(Boolean);
    if(c) return c;
  }
  return null;
}
function onCardTap(uid){
  hideCardPreview();
  if(!findCardByUid(uid)) return;
  state.cardZoom = {uid};
  render();
}
function onZoomClose(){
  state.cardZoom = null;
  render();
}
function onZoomConfirm(){
  const uid = state.cardZoom && state.cardZoom.uid;
  state.cardZoom = null;
  onPoolCardClick(uid);
}
function cardZoomHtml(){
  const z = state.cardZoom;
  const c = z && findCardByUid(z.uid);
  if(!c){ state.cardZoom = null; return ''; }
  const canPick = !!state.pickResolve && state.pickableUids.includes(c.uid);
  const isMud = !!c.key;
  const kind = state.pickKind;
  const heading = kind==='keep' ? 'Keep this card in storage?' : kind==='mud' ? state.pickPrompt : 'Play this card?';
  const confirmLabel = kind==='keep' ? 'Keep' : kind==='mud' ? 'Use Mud' : 'Play';
  const w = Math.max(120, Math.min(260, Math.round(window.innerWidth*0.62), Math.round((window.innerHeight-220)*180/245)));
  const text = isMud ? `Mud — ${c.t}` : c.isFaceDown ? 'Face down' : `${fmtVal(c.value)}${c.text ? ' — '+c.text : ''}`;
  const visual = isMud
    ? `<img src="${CARD_IMAGES.mud[c.key]}" style="width:${w}px;display:block;border-radius:5px;"/>`
    : cardVisualHtml(c, w, '', true);
  return `<div class="overlay" onclick="if(event.target===this) onZoomClose()"><div class="modal zoom-modal">
    ${canPick ? `<h3>${heading}</h3>` : ''}
    <div class="zoom-card">${visual}</div>
    <p class="zoom-text">${text}</p>
    <div class="zoom-btns">
      ${canPick
        ? `<button class="opt" onclick="onZoomClose()">Cancel</button><button class="opt confirm" onclick="onZoomConfirm()">${confirmLabel}</button>`
        : `<button class="opt" onclick="onZoomClose()">Close</button>`}
    </div>
  </div></div>`;
}
function waitForContinue(){
  return new Promise(resolve=>{ state.continueResolve = resolve; render(); });
}
function onContinueClick(){
  if(!state.continueResolve) return;
  const r = state.continueResolve; state.continueResolve = null;
  r();
}

/* ============================= ABILITY LOGIC ============================= */
async function doRearrange(player, stackColor){
  const original = player.stacks[stackColor];
  const total = original.length;
  if(total < 2) return;
  const remaining = [...original];
  const newOrder = [];
  for(let i=0;i<total;i++){
    if(remaining.length===1){ newOrder.push(remaining.pop()); break; }
    const posLabel = i===0 ? 'bottom' : (i===total-1 ? 'top' : `position ${i+1} from bottom`);
    const opts = remaining.map((c,idx)=>({label: c.isFaceDown ? 'Face down' : fmtVal(c.value), value:idx}));
    let pick;
    if(!player.isHuman){
      // Bury the highest-value card first, so the lowest (best) value card
      // ends up on top — it's the one that survives end-of-round cleanup
      // and carries its value into next round.
      await delay(320);
      let bestIdx=0, bestVal=-Infinity;
      remaining.forEach((c,idx)=>{ const v = c.isFaceDown?0:c.value; if(v>bestVal){ bestVal=v; bestIdx=idx; } });
      pick = bestIdx;
    } else {
      pick = await chooseTarget(player, `${player.name}: choose the card for the ${posLabel} of ${COLOR_NAMES[stackColor]} (${i+1}/${total})`, opts);
    }
    const [card] = remaining.splice(pick,1);
    newOrder.push(card);
  }
  player.stacks[stackColor] = newOrder;
  log(`${player.name} rearranged ${COLOR_NAMES[stackColor]}: now ${newOrder.map(c=>c.isFaceDown?'Face down':fmtVal(c.value)).join(' → ')} (bottom to top).`);
}

function giftMudToNeighbours(player,count){
  giveTargetsOf(player.id).forEach(ti=>{
    const target = state.players[ti];
    for(let i=0;i<count;i++){
      if(target.mudHand.length>=MUD_HAND_LIMIT){
        log(`${target.name} is at the Mud card limit (${MUD_HAND_LIMIT}) and can't receive more from ${player.name}.`);
        break;
      }
      const m = randomMud();
      target.mudHand.push(m);
      log(`${target.name} received a Mud card (${m.t}) from ${player.name}.`);
    }
  });
}
function giveMudToSelf(player,count){
  let added=0;
  for(let i=0;i<count;i++){
    if(player.mudHand.length>=MUD_HAND_LIMIT) break;
    player.mudHand.push(randomMud());
    added++;
  }
  if(added>0) log(`${player.name} gained ${added} Mud card(s).`);
  if(added<count) log(`${player.name} is at the Mud card limit (${MUD_HAND_LIMIT}) — didn't gain ${count-added} more.`);
}
// Simulator bookkeeping (no-op in a normal game): Splat/Big Splat cards
// received from gifts, per player, per game and per turn.
function noteGift(ti){
  const st = state.simStats; if(!st) return;
  st.received[ti]++; st.turnReceived[ti]++;
}
// Simulator bookkeeping: for every card in an AI's drafting pool, whether it
// was played, stored or passed on — keyed by card value (purple as P2-P4)
// and personality.
function noteDraft(p, pool, playCard, storeCard){
  const cs = state.simStats.cards;
  pool.forEach(c=>{
    const key = c.color==='purple' ? 'P'+c.value : String(c.value);
    const k = key+'|'+p.aiType;
    const e = cs[k] || (cs[k] = {key, type:p.aiType, text:c.color==='purple' ? 'Wild — play in any stack' : c.text, seen:0, played:0, stored:0});
    e.seen++;
    if(c===playCard) e.played++;
    else if(c===storeCard) e.stored++;
  });
}
function giveStarterToNeighbours(player, count){
  giveTargetsOf(player.id).forEach(ti=>{
    const target = state.players[ti];
    for(let k=0;k<count;k++){
      const s = randomStarter();
      target.stacks[s.color].push(s);
      noteGift(ti);
      log(`${target.name} received a ${COLOR_NAMES[s.color]} Splat card (${fmtVal(s.value)}) from ${player.name}.`);
    }
  });
}

function giveBigSplatToNeighbours(player, count){
  giveTargetsOf(player.id).forEach(ti=>{
    const target = state.players[ti];
    for(let k=0;k<count;k++){
      const s = randomBigSplat();
      target.stacks[s.color].push(s);
      noteGift(ti);
      log(`${target.name} received a ${COLOR_NAMES[s.color]} Big Splat card (${fmtVal(s.value)}) from ${player.name}.`);
    }
  });
}

async function applyMud(player, mud, aiArg){
  switch(mud.key){
    case 'rearrange': {
      // AI: carry out exactly the rearrange its simulation planned.
      const plan = !player.isHuman && aiArg;
      if(plan && player.stacks[plan.stack].length>=2){
        player.stacks[plan.stack] = mudRearrangeOrder(player.stacks[plan.stack], plan.order);
        log(`${player.name} used Mud to rearrange ${COLOR_NAMES[plan.stack]}: now ${player.stacks[plan.stack].map(c=>c.isFaceDown?'Face down':fmtVal(c.value)).join(' → ')} (bottom to top).`);
        return {};
      }
      const opts = COLORS.filter(c=>player.stacks[c].length>=2).map(c=>({label:`${COLOR_NAMES[c]} (${player.stacks[c].length})`, value:c}));
      if(opts.length===0){ log(`${player.name}'s Mud (Rearrange) fizzles — no stack has enough cards.`); return {}; }
      const sc = await chooseTarget(player, `${player.name} — Mud: choose a stack to rearrange`, opts);
      await doRearrange(player, sc);
      return {};
    }
    case 'move2': {
      // Two independent "move the top card of one stack to another" moves —
      // NOT a swap. Each move is chosen fresh, so the same or different
      // stacks can be picked each time. An AI makes the two moves it planned.
      const planned = !player.isHuman && aiArg && aiArg.moves;
      for(let i=0; i<2; i++){
        if(planned && planned[i] && player.stacks[planned[i].src].length>0){
          const {src, dst} = planned[i];
          const card = player.stacks[src].pop();
          player.stacks[dst].push(card);
          log(`${player.name} used Mud to move ${card.isFaceDown?'a face down card':fmtVal(card.value)} from ${COLOR_NAMES[src]} to ${COLOR_NAMES[dst]} (${i+1}/2).`);
          continue;
        }
        const srcOpts = COLORS.filter(c=>player.stacks[c].length>0).map(c=>({label:COLOR_NAMES[c], value:c}));
        if(srcOpts.length===0){
          log(`${player.name}'s Mud (Move 2) has nothing left to move (move ${i+1}/2).`);
          break;
        }
        const src = await chooseTarget(player, `${player.name} — Mud: move top card of which stack? (${i+1}/2)`, srcOpts);
        const dstOpts = COLORS.filter(c=>c!==src).map(c=>({label:COLOR_NAMES[c], value:c}));
        const dst = await chooseTarget(player, `${player.name} — Mud: move it to which stack? (${i+1}/2)`, dstOpts);
        const card = player.stacks[src].pop();
        player.stacks[dst].push(card);
        log(`${player.name} used Mud to move ${card.isFaceDown?'a face down card':fmtVal(card.value)} from ${COLOR_NAMES[src]} to ${COLOR_NAMES[dst]} (${i+1}/2).`);
      }
      return {};
    }
    case 'facedown_instead':
      log(`${player.name} will play their drafted card face down instead.`);
      return {mudFaceDown:true};
    case 'play_any':
      log(`${player.name} may play their drafted card into any stack this turn.`);
      return {mudPlayAny:true};
    case 'use_under':
      log(`${player.name} will use the ability of the card underneath instead, when they play.`);
      return {mudUseUnder:true};
  }
  return {};
}

async function runAbility(key, ctx){
  const {player, targetColor, stack} = ctx;
  switch(key){
    case 'give_starter_neighbours': await giveStarterToNeighbours(player,1); break;
    case 'give_starter_neighbours_2': await giveStarterToNeighbours(player,2); break;
    case 'give_big_splat_neighbour': await giveBigSplatToNeighbours(player,1); break;
    case 'gain_starter_2': {
      for(let i=0;i<2;i++){
        const s = randomStarter();
        player.stacks[s.color].push(s);
        log(`${player.name} gained a ${COLOR_NAMES[s.color]} Splat card (${fmtVal(s.value)}).`);
      }
      break;
    }
    case 'gain_starter': {
      const s = randomStarter();
      player.stacks[s.color].push(s);
      log(`${player.name} gained a ${COLOR_NAMES[s.color]} Splat card (${fmtVal(s.value)}).`);
      break;
    }
    case 'gain_big_splat': {
      const s = randomBigSplat();
      player.stacks[s.color].push(s);
      log(`${player.name} gained a ${COLOR_NAMES[s.color]} Big Splat card (${fmtVal(s.value)}).`);
      break;
    }
    case 'rearrange': {
      if(player.stacks[targetColor].length<2){ log(`${player.name}'s ${COLOR_NAMES[targetColor]} stack isn't big enough to rearrange.`); break; }
      await doRearrange(player, targetColor);
      break;
    }
    case 'gift_mud': giftMudToNeighbours(player,1); break;
    case 'move_top': {
      const srcOpts = COLORS.filter(c=>player.stacks[c].length>0).map(c=>({label:COLOR_NAMES[c], value:c}));
      if(srcOpts.length===0){ log(`${player.name} has nothing to move.`); break; }
      // Moving a card between your own stacks never changes your raw score,
      // so every AI (not just the Goal Chaser) gets this goal-dodge for
      // free — it costs them nothing relative to their main strategy.
      // Shrink whichever goal colour is active by moving a card OUT of it...
      // (The Planner/Destroyer use their own picker so the move matches what they simulated.)
      const plannerMove = usesSimPlan(player) ? plannerMovePick(player.stacks) : null;
      const srcAiPick = plannerMove ? plannerMove.src : !player.isHuman ? targetGoalColor(player, srcOpts.map(o=>o.value)) : null;
      const src = await chooseTargetSmart(player, `${player.name}: move the top card of which stack?`, srcOpts, srcAiPick);
      const dstOpts = COLORS.filter(c=>c!==src).map(c=>({label:COLOR_NAMES[c], value:c}));
      // ...and dump it somewhere that doesn't feed a different goal colour.
      const dstAiPick = plannerMove ? plannerMove.dst : !player.isHuman ? avoidGoalColor(player, dstOpts.map(o=>o.value)) : null;
      const dst = await chooseTargetSmart(player, `${player.name}: move it to which stack?`, dstOpts, dstAiPick);
      const card = player.stacks[src].pop();
      player.stacks[dst].push(card);
      log(`${player.name} moved ${card.isFaceDown?'a face down card':fmtVal(card.value)} from ${COLOR_NAMES[src]} to ${COLOR_NAMES[dst]}.`);
      break;
    }
    case 'gain_mud': giveMudToSelf(player,1); break;
    case 'destroy_other': {
      const opts = COLORS.filter(c=>c!==targetColor && player.stacks[c].length>0).map(c=>({label:COLOR_NAMES[c], value:c}));
      if(opts.length===0){ log(`${player.name} has no other stack to destroy from.`); break; }
      // The Goal Chaser prefers shrinking an active goal colour's stack
      // outright (fewer points risked AND a count closer to 0). Everyone
      // else destroys whichever top card is worth the most, with a light
      // secondary nudge toward a stack that happens to be feeding a goal.
      const colorOptions = opts.map(o=>o.value);
      const aiPick = player.aiType==='goal'
        ? (targetGoalColor(player, colorOptions) || bestDestroyColor(player, targetColor, colorOptions))
        : bestDestroyColor(player, targetColor, colorOptions, true);
      const sc = await chooseTargetSmart(player, `${player.name}: destroy the top card of which stack?`, opts, aiPick);
      const removed = player.stacks[sc].pop();
      state.discard.push(toDiscard(removed));
      log(`${player.name} destroyed ${fmtVal(removed.value)} from ${COLOR_NAMES[sc]}.`);
      break;
    }
    case 'gain_mud_2': giveMudToSelf(player,2); break;
    case 'flip_2_tops': {
      // Flip up to 2 other face-up top cards; already flipped tops can't be chosen.
      const opts = COLORS.filter(c=>c!==targetColor && player.stacks[c].length>0 && !player.stacks[c][player.stacks[c].length-1].isFaceDown)
        .map(c=>({label:COLOR_NAMES[c], value:c}));
      let count=0;
      for(let i=0;i<2 && opts.length>0;i++){
        const flipAiPick = usesSimPlan(player) ? plannerFlipPick(player.stacks, opts.map(o=>o.value)) : null;
        const sc = await chooseTargetSmart(player, `${player.name}: flip the top card of which stack? (${i+1}/2)`, opts, flipAiPick);
        const s = player.stacks[sc];
        s[s.length-1] = {...s[s.length-1], isFaceDown:true};
        log(`${player.name} turned the top of ${COLOR_NAMES[sc]} face down.`);
        count++;
        opts.splice(opts.findIndex(o=>o.value===sc),1);
      }
      if(count===0) log(`${player.name} had no face-up top cards to flip.`);
      break;
    }
    case 'turn_facedown': {
      const opts = COLORS.filter(c=>c!==targetColor && player.stacks[c].length>0).map(c=>{
        const s = player.stacks[c];
        return {label: COLOR_NAMES[c] + (!state.destroy89 && s[s.length-1].isFaceDown ? ' (already flipped — destroy it)' : ''), value:c};
      });
      let count=0;
      for(let i=0;i<2 && opts.length>0;i++){
        const flipAiPick = usesSimPlan(player) ? plannerFlipPick(player.stacks, opts.map(o=>o.value)) : null;
        const sc = await chooseTargetSmart(player, `${player.name}: ${state.destroy89?'destroy':'flip'} the top card of which stack? (${i+1}/2)`, opts, flipAiPick);
        const s = player.stacks[sc];
        const top = s[s.length-1];
        if(top.isFaceDown || state.destroy89){
          // An already-flipped top card is destroyed instead of flipped (and with
          // the "destroy lineup" option every target is destroyed).
          s.pop();
          state.discard.push(toDiscard(top));
          log(`${player.name} destroyed the flipped top card of ${COLOR_NAMES[sc]}.`);
        } else {
          // Keep the card's real identity — only its face-down status changes —
          // so it returns to its proper discard pile, revealed, if later removed.
          s[s.length-1] = {...top, isFaceDown:true};
          log(`${player.name} turned the top of ${COLOR_NAMES[sc]} face down.`);
        }
        count++;
        const idx = opts.findIndex(o=>o.value===sc);
        if(idx!==-1) opts.splice(idx,1);
      }
      if(count===0) log(`${player.name} had no other stacks to turn face down.`);
      break;
    }
    case 'destroy_facedown_starter': {
      let destroyed = 0;
      for(let i=0;i<3;i++){
        const opts = [];
        COLORS.forEach(c=>{
          player.stacks[c].forEach((card,idx)=>{
            if(card.isStarter || card.isBigSplat || card.isFaceDown){
              opts.push({label:`${COLOR_NAMES[c]} — ${card.isFaceDown?'Flipped':(card.isBigSplat?'Big Splat':'Splat')+' '+fmtVal(card.value)} (pos ${idx+1})`, value:JSON.stringify({c, idx})});
            }
          });
        });
        if(opts.length===0) break;
        // AI always destroys whichever eligible card is worth the most.
        let aiPick = null;
        if(!player.isHuman){
          let bestVal=-Infinity;
          COLORS.forEach(c=>{
            player.stacks[c].forEach((card,idx)=>{
              if(card.isStarter || card.isBigSplat || card.isFaceDown){
                const v = card.isFaceDown?0:card.value;
                if(v>bestVal){ bestVal=v; aiPick=JSON.stringify({c, idx}); }
              }
            });
          });
        }
        const pick = await chooseTargetSmart(player, `${player.name}: destroy a Splat/flipped card (${i+1}/3)`, opts, aiPick);
        const {c, idx} = JSON.parse(pick);
        const [removed] = player.stacks[c].splice(idx,1);
        state.discard.push(toDiscard(removed));
        destroyed++;
      }
      log(`${player.name} destroyed ${destroyed} Splat/flipped card(s).`);
      break;
    }
    case 'destroy_under': {
      // Flip the 2 cards directly under this one; any already face down is
      // destroyed instead. Work from the higher index down so a splice
      // doesn't shift the position of the deeper card.
      let flippedCount=0, removedCount=0;
      const lowest = Math.max(0, stack.length-3);
      for(let idx=stack.length-2; idx>=lowest; idx--){
        const card = stack[idx];
        if(card.isFaceDown || state.destroy89){
          stack.splice(idx,1);
          state.discard.push(toDiscard(card));
          removedCount++;
        } else {
          stack[idx] = {...card, isFaceDown:true};
          flippedCount++;
        }
      }
      log(`${player.name} flipped ${flippedCount} and destroyed ${removedCount} card(s) underneath in ${COLOR_NAMES[targetColor]}.`);
      break;
    }
    default: break;
  }
}

// A card leaving play and entering the discard pile is always revealed —
// face-down status only ever applies while a card sits in a tableau.
function toDiscard(card){ return card.isFaceDown ? {...card, isFaceDown:false} : card; }

function resolveCardForPlacement(card, underCard){
  return {value:card.value, ability:card.ability, text:card.text};
}

async function resolvePlay(player, card){
  let mudPlayAny=false, mudUseUnder=false, mudFaceDown=false;

  if(player._mudFlags){
    // Humans already chose and used their Mud during the simultaneous draft
    // (see humanMud) — only its effect on this placement is left.
    ({mudPlayAny, mudUseUnder, mudFaceDown} = player._mudFlags);
    player._mudFlags = null;
  } else if(!player.isHuman){
    // Each AI spends exactly the Mud card(s) its simulation planned for this
    // play (up to two, chained in order) — which Mud cards it considers
    // depends on its personality.
    const plan = player._plan || {};
    if(state.simStats && plan.mud && plan.mudSaved!=null){ state.simStats.mudSavedN++; state.simStats.mudSaved += plan.mudSaved; }
    for(const [key, arg] of [[plan.mud, plan.mudArg], [plan.mud2, plan.mudArg2]]){
      const idx = key ? player.mudHand.findIndex(m=>m.key===key) : -1;
      if(idx===-1) continue;
      await delay(200);
      if(state.simStats){
        const st = state.simStats; st.mudUses++;
        st.mudByKey[key] = (st.mudByKey[key]||0) + 1;
        if(plan.mud2) st.mudChains++;
      }
      const mud = player.mudHand.splice(idx,1)[0];
      const res = await applyMud(player, mud, arg);
      if(res.mudPlayAny) mudPlayAny=true;
      if(res.mudUseUnder) mudUseUnder=true;
      if(res.mudFaceDown) mudFaceDown=true;
    }
  }

  let targetColor;
  if(card.color===null || card.color==='purple' || mudPlayAny || mudFaceDown){
    const opts = COLORS.map(c=>({label:COLOR_NAMES[c], value:c}));
    // Every AI steers a free placement away from a majority it doesn't want;
    // the Goal Chaser additionally knows how to defuse non-colour goals.
    let aiPick = null;
    if(!player.isHuman){
      aiPick = usesSimPlan(player) && player._plan ? player._plan.target
        : player.aiType==='goal'
        ? goalChaserPlacement(player, opts.map(o=>o.value))
        : avoidGoalColor(player, opts.map(o=>o.value));
    }
    targetColor = await chooseTargetSmart(player, `${player.name}: choose a stack for ${cardShortLabel(card)}`, opts, aiPick);
  } else {
    targetColor = card.color;
  }

  const stack = player.stacks[targetColor];

  if(mudFaceDown){
    // Keep the card's real identity while face down; it's just hidden from
    // view and worth 0 until (if ever) it's washed/destroyed and revealed.
    const playedCard = {...card, isFaceDown:true};
    stack.push(playedCard);
    log(`${player.name} played ${cardShortLabel(card)} face down into ${COLOR_NAMES[targetColor]} (worth 0).`);
    return;
  }

  const underCard = stack.length>0 ? stack[stack.length-1] : null;

  const resolved = resolveCardForPlacement(card, underCard);
  let playedValue = resolved.value;
  let effectiveAbility = resolved.ability;
  let effectiveText = resolved.text;

  if(mudUseUnder){
    if(underCard && underCard.ability){ effectiveAbility = underCard.ability; effectiveText = underCard.text; }
    else { effectiveAbility = null; effectiveText=''; }
  }

  const playedCard = {uid:card.uid, color:card.color, origin:card.origin, value:playedValue, printValue:card.printValue, ability:effectiveAbility, text:effectiveText, isStarter:card.isStarter, isFaceDown:false};
  stack.push(playedCard);
  log(`${player.name} placed ${fmtVal(playedValue)} into ${COLOR_NAMES[targetColor]}${effectiveAbility? ' → '+effectiveText : ''}`);

  if(effectiveAbility){
    await runAbility(effectiveAbility, {player, targetColor, stack});
  }
}

/* ============================= SCORING ============================= */
function rawStackSum(p,c){ return p.stacks[c].reduce((a,x)=>a+(x.isFaceDown? 0 : x.value),0); }
function stackValue(p,c){ return rawStackSum(p,c); }

function computeRoundScores(){
  const cards = [state.roundScoreCard, state.roundScoreCard2].filter(Boolean);
  const results = state.players.map(p=>{
    let base=0;
    COLORS.forEach(c=>{ base += stackValue(p,c); });
    return {player:p, base, bonus:0, notes:[]};
  });

  // Majority scoring — up to two cards active this round.
  cards.forEach(card=>{
    let counts;
    if(card.singleColour){
      counts = state.players.map(p=>{
        let n=0;
        COLORS.forEach(c=>{
          const s = p.stacks[c];
          if(s.length>0){
            const origins = new Set(s.filter(cd=>cd.origin).map(cd=>cd.origin));
            if(origins.size===1) n++;
          }
        });
        return {p, count:n};
      });
    } else if(card.custom==='splat_facedown'){
      counts = state.players.map(p=>{
        let n=0;
        COLORS.forEach(c=>{
          p.stacks[c].forEach(cd=>{ if(cd.isStarter || cd.isBigSplat || cd.isFaceDown) n++; });
        });
        return {p, count:n};
      });
    } else if(card.custom==='big_stacks'){
      counts = state.players.map(p=>{
        let n=0;
        COLORS.forEach(c=>{ if(p.stacks[c].length>=3) n++; });
        return {p, count:n};
      });
    } else {
      counts = state.players.map(p=>({p, count:p.stacks[card.color].length}));
    }
    counts.sort((a,b)=>b.count-a.count);
    const n = state.players.length;
    const tiers=[15,10,5];
    const used = tiers.slice(Math.max(0,3-(n-1)));
    let rank=0;
    for(let i=0;i<counts.length;i++){
      if(i>0 && counts[i].count!==counts[i-1].count) rank=i;
      const tierVal = used[rank]!==undefined ? used[rank] : 0;
      if(tierVal>0 && counts[i].count>0){
        const r = results.find(x=>x.player===counts[i].p);
        r.bonus += tierVal;
        r.notes.push(`${card.singleColour? 'Single-colour stacks' : COLOR_NAMES[card.color]} count ${counts[i].count} → +${tierVal}`);
      }
    }
  });

  results.forEach(r=>{ r.total = r.base + r.bonus; r.player.total += r.total; });
  return results;
}

function cleanupStacks(){
  // Wash every stack down to just its top card(s) at the end of each round —
  // 1 by default, or 2 when the "keep top 2" game option is on.
  const keep = state.keepTopCards || 1;
  state.players.forEach(p=>{
    COLORS.forEach(c=>{
      const s = p.stacks[c];
      if(s.length<=keep) return;
      const removed = s.slice(0, s.length-keep);
      p.stacks[c] = s.slice(s.length-keep);
      state.discard.push(...removed.map(toDiscard));
    });
  });
  log(keep===1 ? 'Cleanup: each stack was washed down to its top card.' : `Cleanup: each stack was washed down to its top ${keep} cards.`);
}

// Proactively top up both decks from the discard pile at the end of every
// round, rather than waiting for a mid-draw reshuffle to catch an empty
// deck. Each discarded card goes back into whichever deck it came from
// (main Paint deck vs Splat/starter deck), shuffled and placed at the
// BOTTOM — cards already in the deck still get drawn first.
function replenishDecksFromDiscard(){
  const discard = state.discard;
  const mainUsable = discard.filter(c=>c.color!==null && !c.isStarter && !c.isBigSplat);
  const starterUsable = discard.filter(c=>c.isStarter);
  const bigSplatUsable = discard.filter(c=>c.isBigSplat);
  if(mainUsable.length>0) state.deck = [...shuffle(mainUsable), ...state.deck];
  if(starterUsable.length>0) state.starterDeck = [...shuffle(starterUsable), ...state.starterDeck];
  if(bigSplatUsable.length>0) state.bigSplatDeck = [...shuffle(bigSplatUsable), ...state.bigSplatDeck];
  state.discard = discard.filter(c=>c.color===null && !c.isStarter && !c.isBigSplat);
  if(mainUsable.length>0 || starterUsable.length>0 || bigSplatUsable.length>0){
    log(`End of round: discard pile shuffled into the bottom of the deck(s) — ${mainUsable.length} Paint card(s), ${starterUsable.length} Splat card(s), ${bigSplatUsable.length} Big Splat card(s).`);
  }
}

/* ============================= GAME FLOW ============================= */
const HAND_SIZE = 7;
const TURNS_PER_ROUND = 6;
const MUD_HAND_LIMIT = 3;
const DEFERRED_GIFT_ABILITIES = new Set(['give_starter_neighbours','give_starter_neighbours_2','give_big_splat_neighbour','gift_mud']);

function dealHands(){
  // Deal one card at a time, round-robin across players (like a real
  // dealer), rather than fully dealing one player before moving to the
  // next. With a small colour pool this means that if the deck+discard
  // can't cover a full deal, the shortfall is shared evenly instead of
  // whichever player is dealt last being left with nothing.
  state.players.forEach(p=>{ p.hand = []; p.stored = null; });
  for(let i=0;i<HAND_SIZE;i++){
    state.players.forEach(p=>{
      const [card] = drawCards(1);
      if(card) p.hand.push(card);
    });
  }
  const shortHanded = state.players.filter(p=>p.hand.length<HAND_SIZE);
  if(shortHanded.length>0){
    log(`The card pool ran dry — ${shortHanded.map(p=>`${p.name} (${p.hand.length}/${HAND_SIZE})`).join(', ')} got a short hand this round.`);
  }
  state.players.forEach(p=>{
    if(p.mudHand.length < MUD_HAND_LIMIT) p.mudHand.push(randomMud());
  });
  log(`Mud cards dealt for the round (limit ${MUD_HAND_LIMIT} per player).`);
}
function pickRoundScoreCard(){
  if(state.scoringDeck.length<2) state.scoringDeck = shuffle([...SCORING_POOL]);
  state.roundScoreCard = state.scoringDeck.pop();
  state.roundScoreCard2 = state.scoringDeck.pop();
}

async function draftTurn(turnNum){
  if(state.simMode) return draftTurnInner(turnNum);
  const turnStartSnapshot = JSON.parse(JSON.stringify(state));
  try{
    await draftTurnInner(turnNum);
  } catch(e){
    if(e instanceof UndoSignal){
      state = turnStartSnapshot;
      state.pickResolve = null; state.continueResolve = null; state.modal = null;
      state.pickableUids = []; state.pickPrompt = '';
      render();
    }
    throw e;
  }
}
// A human's Mud for this turn, chosen during the simultaneous draft right
// after their play and keep picks. Every Mud effect only touches the player's
// own stacks, and gifts wait until everyone has placed, so using it now plays
// out the same as using it just before the card is placed.
async function humanMud(player, card){
  const flags = {mudPlayAny:false, mudUseUnder:false, mudFaceDown:false};
  // Loop so multiple Mud cards can be chained onto the same play.
  // Mud cards sit in the hand bar and are tapped + confirmed like any card.
  while(player.mudHand.length>0 && player.isHuman){
    if(!player.remote){ state.statusText = `Playing ${cardShortLabel(card)} — use a Mud card first, or play normally.`; render(); }
    const mudUid = await waitForPoolPick(`Use a Mud card before playing ${cardShortLabel(card)}?`, player.mudHand, 'mud', player);
    const idx = player.mudHand.findIndex(m=>m.uid===mudUid);
    if(idx===-1) break;
    const mud = player.mudHand.splice(idx,1)[0];
    const res = await applyMud(player, mud);
    if(res.mudPlayAny) flags.mudPlayAny=true;
    if(res.mudUseUnder) flags.mudUseUnder=true;
    if(res.mudFaceDown) flags.mudFaceDown=true;
  }
  return flags;
}
async function humanDraft(human, turnNum, isLastTurn){
  const humanPool = [...human.hand];
  if(human.stored) humanPool.push(human.stored);
  const here = !human.remote;
  if(humanPool.length===0){
    // Card pool is exhausted (deck + discard both ran dry) — nothing to draft this turn.
    human._playCard = null;
    human.stored = null;
    human._passHand = [];
    return;
  }
  if(here) state.statusText = `Turn ${turnNum} of ${TURNS_PER_ROUND} — choose a card to play.`;
  const playUid = await waitForPoolPick('Choose a card to play', humanPool, 'play', human);
  const playCard = humanPool.find(c=>c.uid===playUid);
  let afterPlayPool = humanPool.filter(c=>c!==playCard);

  let storeCard = null;
  if(!isLastTurn && afterPlayPool.length>0){
    if(here){ state.statusText = 'Choose a card to keep in storage for later.'; render(); }
    const storeUid = await waitForPoolPick('Choose a card to keep in storage', afterPlayPool, 'keep', human);
    storeCard = afterPlayPool.find(c=>c.uid===storeUid);
  }
  const mudFlags = await humanMud(human, playCard);
  if(here) state.statusText = '';
  if(!human.isHuman) return;   // an AI took this seat over mid-pick: the AI drafts it below
  human._playCard = playCard;
  human._mudFlags = mudFlags;
  human.stored = storeCard;
  human._passHand = afterPlayPool.filter(c=>c!==storeCard);
}
async function draftTurnInner(turnNum){
  const isLastTurn = turnNum === TURNS_PER_ROUND;
  state.turn = turnNum;
  state.phase = 'drafting';
  render();

  // Every human seat — the player at this device and any online friends —
  // drafts at the same time; the reveal waits until all of them have picked.
  await Promise.all(state.players.filter(p=>p.isHuman).map(p=>humanDraft(p, turnNum, isLastTurn)));

  // AI players: drafting heuristic depends on their assigned personality
  // (see aiDraftPick / AI PERSONALITIES above).
  state.players.filter(p=>!p.isHuman).forEach(p=>{
    const pool = [...p.hand];
    if(p.stored) pool.push(p.stored);
    const {playCard, storeCard, passCards} = aiDraftPick(p, pool, isLastTurn);
    if(state.simStats) noteDraft(p, pool, playCard, storeCard);
    p._playCard = playCard;
    p.stored = storeCard;
    p._passHand = passCards;
  });

  state.phase = 'reveal';
  state.statusText = 'Revealing drafted cards...';
  log('— ' + state.players.map(p=> p._playCard ? `${p.name} drafted ${cardShortLabel(p._playCard)}` : `${p.name} has no card to draft`).join(' · '));
  await delay(450);

  // All players play their card and activate their ability "simultaneously"
  // — resolved one at a time below, but "give to neighbour" effects are
  // deferred until every player has placed their own card, so a gift lands
  // on top of whatever the recipient just played instead of arriving early
  // and getting buried under it.
  const origRunAbility = runAbility;
  runAbility = async function(key, ctx){
    if(state.pendingGifts && DEFERRED_GIFT_ABILITIES.has(key)){
      state.pendingGifts.push({key, ctx});
      return;
    }
    return origRunAbility(key, ctx);
  };

  state.pendingGifts = [];
  try{
    for(const p of state.players){
      state.resolvingName = p.name;
      state.statusText = `Resolving ${p.name}'s play...`;
      render();
      if(p._playCard){
        await resolvePlay(p, p._playCard);
      } else {
        log(`${p.name} had no card to play this turn.`);
      }
      render();
      await delay(200);
    }
    for(const g of state.pendingGifts){
      if(state.simStats && g.key!=='gift_mud'){
        const st = state.simStats, t = g.ctx.player.aiType;
        st.giftPlays++; st.typeGiftPlays[t] = (st.typeGiftPlays[t]||0) + 1;
      }
      await origRunAbility(g.key, g.ctx);
      render();
      await delay(150);
    }
  } finally {
    // Always restore runAbility, even if something above threw, so a single
    // bad turn can't permanently leave it wrapped layer upon layer.
    runAbility = origRunAbility;
    state.pendingGifts = null;
  }
  state.resolvingName = null;
  if(state.simStats){
    const st = state.simStats;
    st.maxInTurn = Math.max(st.maxInTurn, ...st.turnReceived);
    st.turnReceived.forEach(k=>{ st.turnHist[Math.min(k,4)]++; });
    st.turnReceived = st.turnReceived.map(()=>0);
  }

  const n = state.players.length;
  // Drafted hands always pass the OPPOSITE way from this round's ability
  // pass-token direction — if abilities push cards to the right neighbour,
  // drafted hands move left, and vice versa.
  const handFromOffset = state.passDirection==='right' ? 1 : -1;
  const newHands = state.players.map((p,i)=> state.players[(i+handFromOffset+n)%n]._passHand);
  state.players.forEach((p,i)=> p.hand = newHands[i]);
  render();
}

async function playRound(){

  state.round++;
  const other = state.passDirectionBase==='right' ? 'left' : 'right';
  state.passDirection = (state.round % 2 === 1) ? state.passDirectionBase : other;
  if(state.simStats){
    state.simStats.carried = state.round>1 ? state.players.flatMap(p=>COLORS.flatMap(c=>p.stacks[c].filter(cd=>!cd.isFaceDown).map(cd=>({p, uid:cd.uid, value:cd.value})))) : null;
  }
  dealHands();
  pickRoundScoreCard();
  log(state.giveBoth
    ? `— Round ${state.round} begins — Give-abilities hit both neighbours; hands pass ${state.passDirection==='right'?'LEFT':'RIGHT'} this round.`
    : `— Round ${state.round} begins — Give-abilities pass to each player's ${state.passDirection.toUpperCase()} neighbour this round.`);
  render();

  for(let t=1;t<=TURNS_PER_ROUND;t++){
    let turnDone = false;
    while(!turnDone){
      try{
        await draftTurn(t);
        turnDone = true;
      } catch(e){
        if(e instanceof UndoSignal){ continue; } // state already reverted; redo this turn
        throw e;
      }
    }
  }

  // Hand size is larger than turns per round, so one drafted card per player
  // never gets played. Return it (and anything left in storage) to the
  // discard pile instead of losing it, so it stays in circulation for the
  // deck's reshuffle-from-discard.
  state.players.forEach(p=>{
    if(p.hand.length>0){ state.discard.push(...p.hand.map(toDiscard)); p.hand = []; }
    if(p.stored){ state.discard.push(toDiscard(p.stored)); p.stored = null; }
  });

  if(state.simStats && state.simStats.carried){
    // Simulator: how many of the cards carried over from last round's cleanup
    // are still in place, face up, and so score again this round.
    const st = state.simStats;
    st.carried.forEach(({p, uid, value})=>{
      const still = COLORS.some(c=>p.stacks[c].some(cd=>cd.uid===uid && !cd.isFaceDown));
      st.carrySeen++; if(still) st.carrySurvived++;
      st.carryValueSeen += Math.abs(value); if(still) st.carryValueSurvived += Math.abs(value);
    });
  }
  const results = computeRoundScores();
  if(state.simStats) results.forEach(r=>{ state.simStats.baseSum += r.base; state.simStats.bonusSum += r.bonus; });
  state.phase = 'roundSummary';
  state.lastSummary = results;
  state.statusText = '';
  render();
  if(!state.simMode) await waitForContinue();

  cleanupStacks();
  replenishDecksFromDiscard();
}

function applyMudPenalties(){
  const MUD_PENALTY_PER_CARD = 2;
  state.players.forEach(p=>{
    const penalty = p.mudHand.length * MUD_PENALTY_PER_CARD;
    p.mudPenalty = penalty;
    if(penalty>0){
      p.total -= penalty;
      log(`${p.name} had ${p.mudHand.length} unused Mud card(s) at game end: -${penalty} pts.`);
    }
  });
}

async function startGame(numAI, aiTypeChoices){
  initGame(numAI, aiTypeChoices);
  render();
  for(let i=0;i<3;i++){ await playRound(); }
  applyMudPenalties();
  state.phase = 'final';
  render();
}
function restartGame(){
  if(net && net.role==='host'){ netHostRestart(); return; }
  location.reload();
}

/* ============================= SIMULATOR =============================
   Plays AI-only games (every seat a random personality) with delays, logging
   and rendering switched off, for 2-5 players with the "give to both
   neighbours" option off and then on, under each AI variant below, and tallies
   how gifts land, how often the Splat/Big Splat decks run dry, how often each
   personality plays a give card, and which personalities win. */
const SIM_PLAYER_COUNTS = [2,3,4,5];
const SIM_GIFT_MODES = [
  {label:'One',      giveBoth:false, newLineup:false},
  {label:'One (new)', giveBoth:false, newLineup:true},
  {label:'Both',     giveBoth:true,  newLineup:true}
];
const SIM_AI_VARIANTS = [
  {label:'Base',              aiDenial:false, aiGiftCredit:false, aiMudValue:false, aiMudOption:false},
  {label:'+Keep',             aiDenial:true,  aiGiftCredit:false, aiMudValue:false, aiMudOption:false},
  {label:'+Keep +Gift value', aiDenial:true,  aiGiftCredit:true, aiMudValue:false, aiMudOption:false},
  {label:'+Mud end value',    aiDenial:true,  aiGiftCredit:true, aiMudValue:true,  aiMudOption:false},
  {label:'+Mud in-game value', aiDenial:true, aiGiftCredit:true, aiMudValue:true,  aiMudOption:true,  aiMudAll:false},
  {label:'+Rearrange & Move 2', aiDenial:true, aiGiftCredit:true, aiMudValue:true, aiMudOption:true,  aiMudAll:true},
  {label:'+Carry & Mud chains', aiDenial:true, aiGiftCredit:true, aiMudValue:true, aiMudOption:true,  aiMudAll:true, aiCarryAll:true, aiMudChain:true}
];
function newSimAgg(){
  return {games:0, received:0, seats:0, turnHist:[0,0,0,0,0], maxInTurn:0, giftPlays:0,
    splatReshuffles:0, bigReshuffles:0, splatEmpty:0, bigEmpty:0, gamesSplatEmpty:0, gamesBigEmpty:0,
    scoreSum:0, winScoreSum:0, spreadSum:0, typeSeats:{}, typeWins:{}, typeGiftPlays:{}, cards:{}, mudUses:0, mudByKey:{}, mudChains:0, mudSaved:0, mudSavedN:0, mudUnused:0, baseSum:0, bonusSum:0, carrySeen:0, carrySurvived:0, carryValueSeen:0, carryValueSurvived:0};
}
async function simulateOneGame(nPlayers, mode){
  state.giveBoth = mode.giveBoth; state.newLineup = mode.newLineup;
  initGame(nPlayers-1, null);
  const p0 = state.players[0];
  p0.isHuman = false; p0.name = 'AI 0';
  p0.aiType = AI_TYPES[Math.floor(Math.random()*AI_TYPES.length)];
  state.simStats = {received:Array(nPlayers).fill(0), turnReceived:Array(nPlayers).fill(0), turnHist:[0,0,0,0,0],
    maxInTurn:0, giftPlays:0, typeGiftPlays:{}, cards:{}, mudUses:0, mudByKey:{}, mudChains:0, mudSaved:0, mudSavedN:0, baseSum:0, bonusSum:0, carried:null, carrySeen:0, carrySurvived:0, carryValueSeen:0, carryValueSurvived:0, splatReshuffles:0, bigReshuffles:0, splatEmpty:0, bigEmpty:0};
  for(let i=0;i<3;i++){ await playRound(); }
  applyMudPenalties();
  state.simStats.mudUnused = state.players.reduce((a,p)=>a+p.mudHand.length,0);
  return state.simStats;
}
async function runSimulation(){
  const gamesPer = Math.max(1, parseInt(state.simGames,10) || 200);
  const keepGiveBoth = state.giveBoth, keepLineup = state.newLineup, keepDenial = state.aiDenial, keepCredit = state.aiGiftCredit, keepMud = state.aiMudValue, keepMudOption = state.aiMudOption, keepMudAll = state.aiMudAll, keepCarry = state.aiCarryAll, keepChain = state.aiMudChain;
  const results = {gamesPer, keep:state.keepTopCards, destroy89:state.destroy89, rows:[]};
  // Quick runs (#sim=N&quick) only cover the default gift setup and the two newest AI variants;
  // &last narrows that to the newest AI only, and &keep=2 sets the cleanup option.
  const modes = state.simQuick ? SIM_GIFT_MODES.slice(0,1) : SIM_GIFT_MODES;
  const variants = state.simLastOnly ? SIM_AI_VARIANTS.slice(-1) : state.simQuick ? SIM_AI_VARIANTS.slice(-2) : SIM_AI_VARIANTS;
  const total = modes.length*variants.length*SIM_PLAYER_COUNTS.length*gamesPer;
  let done = 0;
  state.simRunning = true; render();
  state.simMode = true;
  try{
    for(const mode of modes){
     for(const variant of variants){
      state.aiDenial = variant.aiDenial; state.aiGiftCredit = variant.aiGiftCredit; state.aiMudValue = variant.aiMudValue; state.aiMudOption = variant.aiMudOption; state.aiMudAll = !!variant.aiMudAll; state.aiCarryAll = !!variant.aiCarryAll; state.aiMudChain = !!variant.aiMudChain;
      for(const nPlayers of SIM_PLAYER_COUNTS){
        const agg = newSimAgg();
        for(let g=0; g<gamesPer; g++){
          const st = await simulateOneGame(nPlayers, mode);
          agg.games++;
          agg.seats += nPlayers;
          agg.received += st.received.reduce((a,b)=>a+b,0);
          st.turnHist.forEach((k,i)=>agg.turnHist[i]+=k);
          agg.maxInTurn = Math.max(agg.maxInTurn, st.maxInTurn);
          agg.giftPlays += st.giftPlays;
          mergeCardStats(agg.cards, st.cards);
          Object.keys(st.mudByKey).forEach(k=>{ agg.mudByKey[k] = (agg.mudByKey[k]||0) + st.mudByKey[k]; });
          agg.mudUses += st.mudUses; agg.mudChains += st.mudChains;
          agg.baseSum += st.baseSum; agg.bonusSum += st.bonusSum;
          agg.carrySeen += st.carrySeen; agg.carrySurvived += st.carrySurvived; agg.carryValueSeen += st.carryValueSeen; agg.carryValueSurvived += st.carryValueSurvived; agg.mudSaved += st.mudSaved; agg.mudSavedN += st.mudSavedN; agg.mudUnused += st.mudUnused;
          Object.keys(st.typeGiftPlays).forEach(k=>{ agg.typeGiftPlays[k] = (agg.typeGiftPlays[k]||0) + st.typeGiftPlays[k]; });
          agg.splatReshuffles += st.splatReshuffles; agg.bigReshuffles += st.bigReshuffles;
          agg.splatEmpty += st.splatEmpty; agg.bigEmpty += st.bigEmpty;
          if(st.splatEmpty>0) agg.gamesSplatEmpty++;
          if(st.bigEmpty>0) agg.gamesBigEmpty++;
          const totals = state.players.map(p=>p.total);
          const best = Math.min(...totals);
          agg.scoreSum += totals.reduce((a,b)=>a+b,0);
          agg.winScoreSum += best;
          agg.spreadSum += Math.max(...totals) - best;
          const winners = state.players.filter(p=>p.total===best);
          state.players.forEach(p=>{
            agg.typeSeats[p.aiType] = (agg.typeSeats[p.aiType]||0) + 1;
            if(winners.includes(p)) agg.typeWins[p.aiType] = (agg.typeWins[p.aiType]||0) + 1/winners.length;
          });
          done++;
          if(done%10===0){
            const el = document.getElementById('sim-progress');
            if(el) el.textContent = `Simulating… ${done}/${total} games`;
            await new Promise(r=>setTimeout(r,0));
          }
        }
        results.rows.push({mode:mode.label, variant:variant.label, nPlayers, agg});
      }
     }
    }
  } finally {
    state.simMode = false;
    state.simStats = null;
    state.simRunning = false;
    state.giveBoth = keepGiveBoth; state.newLineup = keepLineup; state.aiDenial = keepDenial; state.aiGiftCredit = keepCredit; state.aiMudValue = keepMud; state.aiMudOption = keepMudOption; state.aiMudAll = keepMudAll; state.aiCarryAll = keepCarry; state.aiMudChain = keepChain;
    state.players = []; state.phase = 'intro';
  }
  state.simResults = results;
  render();
}
function mergeCardStats(into, from){
  Object.keys(from).forEach(k=>{
    const e = from[k];
    const t = into[k] || (into[k] = {key:e.key, type:e.type, text:e.text, seen:0, played:0, stored:0});
    t.seen += e.seen; t.played += e.played; t.stored += e.stored;
  });
}
// Per-card draft table for one gift setup, summed over every player count,
// using the current (last) AI variant. Play rate = how often a card that was
// in an AI's pool got played that turn; colour marks cards well above/below
// the average play rate in that column.
const CARD_KEY_ORDER = [...VALUE_DEFS.map(d=>String(d.v)), ...PURPLE_VALUE_DEFS.map(d=>'P'+d.v)];
function cardTableHtml(r, modeLabel){
  const variant = SIM_AI_VARIANTS[SIM_AI_VARIANTS.length-1].label;
  const picked = r.rows.filter(x=>x.mode===modeLabel && x.variant===variant);
  if(picked.length===0) return '';
  const cards = {}; let games = 0;
  picked.forEach(x=>{ mergeCardStats(cards, x.agg.cards); games += x.agg.games; });
  const sum = (key, type) => {
    const out = {seen:0, played:0, stored:0, text:''};
    Object.values(cards).forEach(e=>{
      if(e.key!==key || (type && e.type!==type)) return;
      out.seen += e.seen; out.played += e.played; out.stored += e.stored; out.text = e.text;
    });
    return out;
  };
  const cols = [null, ...AI_TYPES];
  const avgRate = {};
  cols.forEach(t=>{
    const all = CARD_KEY_ORDER.map(k=>sum(k,t));
    const seen = all.reduce((a,e)=>a+e.seen,0), played = all.reduce((a,e)=>a+e.played,0);
    avgRate[t] = seen ? played/seen : 0;
  });
  const rateCell = (e, t) => {
    if(!e.seen) return '<td>—</td>';
    const rate = e.played/e.seen, rel = avgRate[t] ? rate/avgRate[t] : 1;
    const col = rel>1.4 ? 'var(--green)' : rel<0.6 ? 'var(--red)' : 'inherit';
    return `<td style="color:${col}">${(100*rate).toFixed(0)}%</td>`;
  };
  const body = CARD_KEY_ORDER.map(k=>{
    const all = sum(k, null);
    if(!all.seen) return '';
    return `<tr><td><strong>${k.startsWith('P') ? 'Purple '+k.slice(1) : fmtVal(Number(k))}</strong></td>
      <td style="white-space:normal;min-width:180px;font-size:.75rem;">${all.text||'—'}</td>
      <td>${(all.played/games).toFixed(2)}</td>${rateCell(all,null)}<td>${(100*all.stored/all.seen).toFixed(0)}%</td>
      ${AI_TYPES.map(t=>rateCell(sum(k,t),t)).join('')}</tr>`;
  }).join('');
  return `<h3 style="margin-top:16px;">Card draft rates — ${modeLabel} gifts, ${variant} AI, ${games} games (all player counts)</h3>
    <div class="sim-scroll"><table>
      <tr><th>Card</th><th>Ability</th><th>Played / game</th><th>Play rate</th><th>Store rate</th>${AI_TYPES.map(t=>`<th>${AI_TYPE_LABELS[t]} play rate</th>`).join('')}</tr>
      <tr><td></td><td style="color:var(--sub);font-size:.75rem;">Average</td><td></td><td>${(100*avgRate[null]).toFixed(0)}%</td><td></td>${AI_TYPES.map(t=>`<td>${(100*avgRate[t]).toFixed(0)}%</td>`).join('')}</tr>
      ${body}
    </table></div>`;
}
const MUD_SHORT = {rearrange:'Rearrange', play_any:'Any stack', use_under:'Use under', facedown_instead:'Face down', move2:'Move 2'};
function onSimGamesChange(v){ state.simGames = v; }
function simResultsHtml(){
