      const rate = (agg.typeWins[t]||0)/seats;
      const vsFair = rate*nPlayers;
      const col = vsFair>1.25 ? 'var(--green)' : vsFair<0.75 ? 'var(--red)' : 'inherit';
      return `<td style="color:${col}">${(100*rate).toFixed(0)}%</td>`;
    }).join('');
    return `<tr><td>${AI_TYPE_LABELS[t]}</td>${cells}</tr>`;
  }).join('');
  const typeHead = r.rows.map(({mode,variant,nPlayers})=>`<th>${nPlayers}p ${mode} ${variant}</th>`).join('');
  return `<div class="summary sim-results">
    <h3>Simulation — ${r.gamesPer} games per row, keep top ${r.keep}${r.destroy89?'':', old 6-10 cards'}</h3>
    <div class="sim-scroll"><table>
      <tr><th>Players</th><th>Gifts</th><th>AI variant</th><th>Give cards played / game</th><th>Splat cards received / player / game</th>
        <th>Turns receiving 1</th><th>Turns receiving 2+</th><th>Most in one turn</th>
        <th>Splat / Big Splat reshuffles / game</th><th>Games where Splat / Big Splat deck was truly empty</th>
        <th>Avg final score</th><th>Avg winning score</th><th>Avg spread</th>
        <th>Mud spent / player / game</th><th>Mud unused at end / player</th><th>Points saved per Mud spent</th><th>Mud spent / player by type (${MUD_TYPES.map(m=>MUD_SHORT[m.key]).join(' / ')})</th><th>Carried cards still scoring at next round end</th></tr>
      ${rows}
    </table></div>
    <h3 style="margin-top:16px;">Win rate by personality <span style="font-weight:400;color:var(--sub);font-size:.8rem;">(green = well above a fair share, red = well below)</span></h3>
    <div class="sim-scroll"><table><tr><th>AI</th>${typeHead}</tr>${typeRows}</table></div>
    <h3 style="margin-top:16px;">Give cards played per game, by personality</h3>
    <div class="sim-scroll"><table><tr><th>AI</th>${typeHead}</tr>${giftRows}</table></div>
    ${SIM_GIFT_MODES.map(m=>cardTableHtml(r, m.label)).join('')}
  </div>`;
}

/* ============================= ONLINE PLAY =============================
   Browser-to-browser over PeerJS (WebRTC). PeerJS's free public service only
   introduces the browsers; after that they talk directly, so the website
   needs no server of its own. The HOST's browser runs the real game — the
   AIs, the deck, every rule. Whenever a decision belongs to a friend's seat
   (a card pick, a stack, a rearrange) the host asks that friend's browser
   and waits for the answer, checking it is one of the choices offered.
   After every change the host sends each friend a picture of the table with
   everything that friend shouldn't see taken out: other players' hands,
   stored cards and Mud cards, and the real values of face-down cards. */
const PEERJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
const NET_ID_PREFIX = 'dontgetsplat-';
const NET_MAX_PLAYERS = 5;
/* fingerprint of this file's code: host and friends must run the very same version */
const NET_BUILD = (()=>{
  const s = document.currentScript ? document.currentScript.textContent : '';
  let h = 5381;
  for(let i=0;i<s.length;i++) h = (Math.imul(h, 33) ^ s.charCodeAt(i))>>>0;
  return h.toString(36);
})();
let net = null;
/*   host:  {role:'host', code, peer, status, guests:[{conn, open, seat, playerId, name}], seatGuest:{seat:guest},
             asks:{seat:{id, ask, resolve, player}}, askSeq, numAI, started}
     guest: {role:'guest', code, peer, conn, status, mySeat, ask, answered, lobby} */

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function netCleanName(s, fallback){
  s = String(s||'').replace(/[^\p{L}\p{N} _.'-]/gu,'').replace(/\s+/g,' ').trim().slice(0,16);
  return s || fallback;
}
/* remembered between visits: your name, the last room code, and a lasting id so a friend */
/* who drops out gets their own seat back on rejoining */
const netPrefs = (()=>{ try { return JSON.parse(localStorage.getItem('dgs-online')) || {}; } catch(e){ return {}; } })();
function netSavePrefs(){ try { localStorage.setItem('dgs-online', JSON.stringify(netPrefs)); } catch(e){} }
function netNewCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no 0/O or 1/I to misread
  let c = '';
  for(let i=0;i<5;i++) c += A[Math.floor(Math.random()*A.length)];
  return c;
}
function netPlayerId(){
  if(!netPrefs.id){ netPrefs.id = netNewCode()+netNewCode(); netSavePrefs(); }
  return netPrefs.id;
}
function netLoadPeerJs(){
  if(window.Peer) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = PEERJS_URL;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Couldn\'t load the online-play library — check your internet connection.'));
    document.head.appendChild(s);
  });
}
function netErrorText(err){
  const type = err && err.type;
  if(type==='peer-unavailable') return 'No game found with that code — check it with the host.';
  if(type==='unavailable-id') return 'That room code is already in use — go back and host again for a new one.';
  if(type==='network' || type==='server-error' || type==='socket-error' || type==='socket-closed') return 'Can\'t reach the online-play service — check your internet connection.';
  if(type==='browser-incompatible') return 'This browser doesn\'t support online play — try Chrome, Edge, Firefox or Safari.';
  return 'Connection problem: '+((err && (err.message || type)) || err);
}
function netLeave(){
  if(net && net.peer){ try { net.peer.destroy(); } catch(e){} }
  net = null;
}
/* which seat this browser shows as "you" */
function viewSeat(){ return net && net.role==='guest' && net.mySeat!=null ? net.mySeat : 0; }
function netSeatAway(seat){
  if(!net) return false;
  if(net.role==='guest') return !!(state.players[seat] && state.players[seat].away);
  const g = net.seatGuest[seat];
  return !g || !g.open;
}
window.addEventListener('beforeunload', e=>{
  if(net && net.role==='host' && net.started && state.phase!=='final'){ e.preventDefault(); e.returnValue = ''; }
});

/* --- host side --- */
async function netHost(){
  netLeave();
  const me = net = {role:'host', code:netNewCode(), peer:null, status:'Opening a room…', guests:[], seatGuest:{}, asks:{}, askSeq:0, numAI:0, started:false};
  render();
  try { await netLoadPeerJs(); } catch(e){ me.status = e.message; render(); return; }
  if(net!==me) return;
  const peer = me.peer = new Peer(NET_ID_PREFIX+me.code);
  peer.on('open', ()=>{ me.status = 'open'; render(); });
  peer.on('error', err=>{ if(err && err.type==='peer-unavailable') return; me.status = netErrorText(err); render(); });
  // keep the room code registered if the link to the introduction service blips, so friends can still rejoin
  peer.on('disconnected', ()=>{ if(net===me && !peer.destroyed){ try { peer.reconnect(); } catch(e){} } });
  peer.on('connection', conn=>{
    const g = {conn, open:false, seat:null, playerId:null, name:''};
    me.guests.push(g);
    conn.on('open', ()=>{ g.open = true; });
    conn.on('data', msg=>{ if(net===me) netHostReceive(g, msg); });
    conn.on('close', ()=>{
      g.open = false;
      if(net!==me) return;
      if(!me.started) me.guests = me.guests.filter(x=>x!==g);
      render();
    });
  });
}
function netLobbyFriends(){ return net.guests.filter(g=>g.open && g.playerId); }
function netHostReceive(g, msg){
  if(!msg || typeof msg!=='object') return;
  if(msg.t==='hello'){
    if(msg.build!==NET_BUILD){ g.conn.send({t:'version'}); return; }
    g.open = true;
    g.playerId = String(msg.id||'');
    g.name = netCleanName(msg.name, 'Friend');
    if(net.started) netHostReadmit(g);
    else if(netLobbyFriends().length > NET_MAX_PLAYERS-1){ g.playerId = null; g.conn.send({t:'full'}); }
    render();
    return;
  }
  if(msg.t==='ans'){
    const a = g.seat!==null && net.asks[g.seat];
    if(!a || a.id!==msg.id) return;   // stale or doubled-up click
    const ok = a.ask.kind==='pick'
      ? (a.ask.uids.includes(msg.value) || (a.ask.pickKind==='mud' && msg.value===-1))
      : a.ask.options.some(o=>o.value===msg.value);
    if(!ok) return;
    delete net.asks[g.seat];
    a.resolve(msg.value);
    render();
  }
}
/* a friend reconnected mid-game: give them back their own seat, or else any friend seat whose player has gone */
function netHostReadmit(g){
  const away = state.players.filter(p=>p.remote && netSeatAway(p.id));
  const p = away.find(p=>net.seatGuest[p.id] && net.seatGuest[p.id].playerId===g.playerId) || away[0];
  if(!p){ g.conn.send({t:'full'}); return; }
  const old = net.seatGuest[p.id];
  if(old && old!==g) old.seat = null;
  net.seatGuest[p.id] = g;
  g.seat = p.id;
  netSendSnap(g);
}
async function netHostStart(){
  const friends = netLobbyFriends().slice(0, NET_MAX_PLAYERS-1);
  const numAI = Math.min(net.numAI, NET_MAX_PLAYERS-1-friends.length);
  if(friends.length+numAI < 1) return;
  net.started = true;
  net.seatGuest = {}; net.asks = {};
  net.guests.forEach(g=>{ g.seat = null; });
  initGame(friends.length+numAI, Array(friends.length+numAI).fill('random'));
  const ps = state.players;
  const used = new Set();
  const unique = name=>{ let n = name, k = 2; while(used.has(n.toLowerCase())) n = name+' '+(k++); used.add(n.toLowerCase()); return n; };
  ps[0].name = unique(netCleanName(netPrefs.name, 'Host'));
  friends.forEach((g,i)=>{
    const p = ps[i+1];
    p.isHuman = true; p.remote = true; p.aiType = null;
    p.name = unique(g.name);
    g.seat = p.id; net.seatGuest[p.id] = g;
  });
  ps.slice(friends.length+1).forEach((p,i)=>{ p.name = unique('AI '+(i+1)); });
  net.guests.forEach(g=>{ if(g.open && g.playerId && g.seat===null) g.conn.send({t:'full'}); });
  render();
  for(let i=0;i<3;i++){ await playRound(); }
  applyMudPenalties();
  state.phase = 'final';
  render();
}
/* "Play again" sends everyone back to the room with the same code */
function netHostRestart(){
  net.started = false;
  net.asks = {}; net.seatGuest = {};
  net.guests = net.guests.filter(g=>g.open);
  net.guests.forEach(g=>{ g.seat = null; });
  state.phase = 'intro';
  state.introOnline = true;
  state.log = [];
  render();
}
/* ask a friend's browser for a decision; resolves with their answer */
function netAsk(player, ask){
  return new Promise(resolve=>{
    ask.id = ++net.askSeq;
    net.asks[player.id] = {id:ask.id, ask, resolve, player};
    render();
  });
}
function netFallbackOption(options){ return options[Math.floor(Math.random()*options.length)].value; }
/* a friend has gone for good: an AI plays their seat from here on */
function onNetTakeOver(seat){
  const p = state.players[seat];
  if(!p || !p.remote || !netSeatAway(seat)) return;
  p.isHuman = false; p.remote = false;
  p.aiType = AI_TYPES[Math.floor(Math.random()*AI_TYPES.length)];
  log(`${p.name} left — an AI plays their seat from now on.`);
  p.name += ' (AI)';
  const g = net.seatGuest[seat];
  if(g) g.seat = null;
  delete net.seatGuest[seat];
  const a = net.asks[seat];
  if(a){
    delete net.asks[seat];
    a.resolve(a.ask.kind==='pick' ? (a.ask.pickKind==='mud' ? -1 : a.ask.uids[0]) : netFallbackOption(a.ask.options));
  }
  render();
}
/* friends get a fresh picture of the table shortly after every change */
let netBroadcastTimer = null;
function netScheduleBroadcast(){
  if(netBroadcastTimer) return;
  netBroadcastTimer = setTimeout(()=>{ netBroadcastTimer = null; netBroadcast(); }, 60);
}
function netBroadcast(){
  if(!net || net.role!=='host') return;
  if(!net.started){
    const msg = {t:'lobby', names:[netCleanName(netPrefs.name, 'Host'), ...netLobbyFriends().map(g=>g.name)], ai:net.numAI};
    netLobbyFriends().forEach(g=>g.conn.send(msg));
    return;
  }
  net.guests.forEach(g=>{ if(g.open && g.seat!==null) netSendSnap(g); });
}
function netSendSnap(g){ g.conn.send({t:'snap', s:netSnapshot(g.seat), seat:g.seat}); }
function netHideCard(c){ return c.isFaceDown ? {uid:c.uid, isFaceDown:true, value:0} : c; }
/* the table as the player in this seat is allowed to see it */
function netSnapshot(seat){
  const players = state.players.map(p=>{
    const mine = p.id===seat;
    const stacks = {};
    COLORS.forEach(c=>{ stacks[c] = p.stacks[c].map(netHideCard); });
    return {id:p.id, name:p.name, isHuman:p.isHuman, remote:!!p.remote, aiType:null, total:p.total, mudPenalty:p.mudPenalty||0,
      away: !!p.remote && netSeatAway(p.id), stacks,
      hand: mine ? p.hand : p.hand.map(()=>({uid:0})),
      stored: mine ? p.stored : null,
      mudHand: mine ? p.mudHand : p.mudHand.map(()=>({uid:0}))};
  });
  const a = net.asks[seat];
  const localBusy = !!(state.pickResolve || modalResolver);
  const waiting = [...(localBusy ? [state.players[0].name] : []),
    ...Object.values(net.asks).filter(x=>x.player.id!==seat).map(x=>x.player.name)];
  return {phase:state.phase, round:state.round, turn:state.turn, players, log:state.log.slice(0,30),
    roundScoreCard:state.roundScoreCard, roundScoreCard2:state.roundScoreCard2,
    passDirection:state.passDirection, passDirectionBase:state.passDirectionBase, giveBoth:state.giveBoth, newLineup:state.newLineup,
    statusText: a ? '' : waiting.length ? `Waiting for ${waiting.join(', ')}…` : localBusy ? '' : (state.statusText||''),
    lastSummary:(state.lastSummary||[]).map(r=>({player:{name:r.player.name}, base:r.base, bonus:r.bonus, total:r.total, notes:r.notes})),
    ask: a ? a.ask : null};
}

/* --- guest side --- */
async function netJoin(){
  netLeave();
  const code = String(netPrefs.code||'').trim().toUpperCase();
  const me = net = {role:'guest', code, peer:null, conn:null, status:'Connecting…', mySeat:null, ask:null, answered:0, lobby:null};
  if(code.length!==5){ me.status = 'Type the host\'s 5-letter room code first.'; render(); return; }
  render();
  try { await netLoadPeerJs(); } catch(e){ me.status = e.message; render(); return; }
  if(net!==me) return;
  const peer = me.peer = new Peer();
  peer.on('error', err=>{ me.status = netErrorText(err); render(); });
  peer.on('open', ()=>{
    const conn = me.conn = peer.connect(NET_ID_PREFIX+code, {reliable:true, serialization:'json'});
    conn.on('open', ()=>{
      me.status = 'connected';
      conn.send({t:'hello', id:netPlayerId(), name:netPrefs.name||'', build:NET_BUILD});
      render();
    });
    conn.on('data', msg=>{ if(net===me) netGuestReceive(msg); });
    conn.on('close', ()=>{ if(net!==me) return; me.status = 'lost'; render(); });
  });
}
function netSendToHost(msg){ if(net && net.conn && net.conn.open) net.conn.send(msg); }
function netGuestReceive(msg){
  if(!msg || typeof msg!=='object') return;
  if(msg.t==='lobby'){
    net.lobby = msg;
    if(state.phase!=='intro'){ state = {phase:'intro', introOnline:true, players:[], log:[]}; net.mySeat = null; net.ask = null; }
    render();
  } else if(msg.t==='full'){
    net.status = 'That game has no free seat for you.'; render();
  } else if(msg.t==='version'){
    net.status = 'Your page is a different version from the host\'s — both of you reload the page and try again.'; render();
  } else if(msg.t==='snap'){
    const zoom = state.cardZoom;
    state = Object.assign({}, msg.s, {introOnline:false, cardZoom:zoom, modal:null, pickResolve:null, pickableUids:[], pickPrompt:'', continueResolve:null});
    net.mySeat = msg.seat;
    net.ask = msg.s.ask && msg.s.ask.id>net.answered ? msg.s.ask : null;
    netGuestShowAsk();
    render();
  }
}
/* put the host's question on screen, wired so the usual card taps and buttons answer it */
function netGuestShowAsk(){
  modalResolver = null;
  const a = net.ask;
  if(!a) return;
  const send = v=>{
    if(v==='__UNDO__' || net.ask!==a) return;
    net.answered = a.id; net.ask = null;
    netSendToHost({t:'ans', id:a.id, value:v});
    render();
  };
  if(a.kind==='pick'){
    state.pickPrompt = a.prompt; state.pickKind = a.pickKind; state.pickableUids = a.uids; state.pickResolve = send;
  } else {
    state.modal = {title:a.title, options:a.options}; modalResolver = send;
  }
}

/* --- screens --- */
function netStatusText(){
  if(net && net.role==='guest') return net.ask ? (net.ask.kind==='pick' ? net.ask.prompt : net.ask.title) : (state.statusText||'');
  const waiting = net && net.role==='host' ? Object.values(net.asks).map(a=>a.player.name) : [];
  if(waiting.length && !(state.pickResolve || modalResolver)) return `Waiting for ${waiting.join(', ')}…`;
  return state.statusText||'';
}
function netChipHtml(){
  if(!net) return '';
  if(net.role==='host'){
    const away = state.players.filter(p=>p.remote && netSeatAway(p.id));
    return `<div class="roundpill">🌐 Room ${net.code}</div>` + away.map(p=>
      `<div class="roundpill"><span class="net-away">${escHtml(p.name)} disconnected</span>
        <button class="opt" style="margin:0 0 0 8px;padding:4px 10px;" onclick="onNetTakeOver(${p.id})">Let an AI play</button></div>`).join('');
  }
  if(net.conn && net.conn.open) return `<div class="roundpill">🌐 Online</div>`;
  return `<div class="roundpill"><span class="net-away">Disconnected</span>
    <button class="opt" style="margin:0 0 0 8px;padding:4px 10px;" onclick="netJoin()">Rejoin</button></div>`;
}
function netSetupHtml(){
  const nameInput = `<input id="netName" class="net-input" maxlength="16" placeholder="Your name" value="${escHtml(netPrefs.name||'')}" oninput="onNetName(this.value)"/>`;
  let body;
  if(!net){
    body = `
      <p>Each player opens this page on their own device. One person hosts and gets a room code; everyone else joins with it.</p>
      <div class="net-row"><b>Your name</b> ${nameInput}</div>
      <div class="net-row"><button class="opt-btn" onclick="netHost()">Host a game</button></div>
      <div class="net-row"><b>Room code</b>
        <input id="netCode" class="net-input" maxlength="5" autocomplete="off" spellcheck="false" style="width:7em;letter-spacing:.2em;text-transform:uppercase;"
          value="${escHtml(netPrefs.code||'')}" oninput="onNetCode(this.value)" onkeydown="if(event.key==='Enter') netJoin()"/>
        <button class="opt-btn" onclick="netJoin()">Join</button></div>`;
  } else if(net.role==='host'){
    if(net.status!=='open'){
      body = `<p class="net-status">${escHtml(net.status)}</p>`;
    } else {
      const friends = netLobbyFriends().slice(0, NET_MAX_PLAYERS-1);
      const maxAI = NET_MAX_PLAYERS-1-friends.length;
      if(net.numAI>maxAI) net.numAI = maxAI;
      const total = 1+friends.length+net.numAI;
      body = `
        <div>Room code — send this to your friends</div>
        <div class="net-code">${net.code}</div>
        <p>They open this page, choose 🌐 Play online, and type the code.</p>
        <div class="net-row"><b>Your name</b> ${nameInput}</div>
        <div class="net-row"><b>Players</b>
          <span class="net-seat">${escHtml(netCleanName(netPrefs.name,'Host'))} (you)</span>
          ${friends.map(g=>`<span class="net-seat">🌐 ${escHtml(g.name)}</span>`).join('')}
          ${friends.length===0 ? '<span class="status">waiting for friends to join…</span>' : ''}</div>
        <div class="net-row"><b>AI opponents</b>
          ${[...Array(maxAI+1).keys()].map(n=>`<button class="opt" style="margin:0;padding:6px 12px;${n===net.numAI?'background:var(--accent);color:#222;':''}" onclick="onNetAI(${n})">${n}</button>`).join('')}</div>
        <div class="net-row"><button class="opt-btn" onclick="netHostStart()" ${total<2?'disabled':''}>Start game<small>${total} player${total>1?'s':''}</small></button></div>`;
    }
  } else {
    let msg = net.status;
    if(net.status==='connected') msg = net.lobby
      ? `In the room: ${net.lobby.names.join(', ')}${net.lobby.ai ? ` + ${net.lobby.ai} AI` : ''}. Waiting for ${net.lobby.names[0]} to start the game…`
      : 'Connected — waiting for the host…';
    if(net.status==='lost') msg = 'Lost the connection to the host.';
    body = `<div>Room <b>${escHtml(net.code)}</b></div><p class="net-status">${escHtml(msg)}</p>
      ${net.status==='lost' ? `<div class="net-row"><button class="opt-btn" onclick="netJoin()">Try again</button></div>` : ''}`;
  }
  return `<div class="hero">
    <h1 class="brand">🎨 Don't Get Splat</h1>
    <div class="net-panel">
      <div class="ai-setup-label">🌐 Play online</div>
      ${body}
      <div class="net-row" style="margin-top:14px;"><button class="opt" style="margin:0;" onclick="onNetBack()">⟵ Back</button></div>
    </div>
  </div>`;
}
function onNetOpen(){ state.introOnline = true; render(); }
function onNetBack(){ netLeave(); state.introOnline = false; render(); }
function onNetName(v){
  netPrefs.name = netCleanName(v, ''); netSavePrefs();
  if(net && net.role==='host'){ netScheduleBroadcast(); const s = document.querySelector('.net-seat'); if(s) s.textContent = netCleanName(netPrefs.name,'Host')+' (you)'; }
}
function onNetCode(v){ netPrefs.code = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); netSavePrefs(); }
function onNetAI(n){ net.numAI = n; render(); }

/* ============================= INTRO SETUP ============================= */
function onIntroPickCount(n){
  if(!TEST_BUILD){ startGame(n, Array(n).fill('random')); return; }
  state.introNumAI = n;
  state.introAITypes = Array(n).fill('random');

function onIntroTypeChange(i, value){

  render();
}
function onIntroKeepChange(value){

}
function onIntroDestroy89Change(value){

function onIntroStart(){

}

/* ============================= RENDER ============================= */
function cardImageSrc(color, value, kind){
  const bucket = kind==='starter' ? CARD_IMAGES.starter : kind==='bigSplat' ? CARD_IMAGES.bigSplat : CARD_IMAGES.card;
  const c = bucket && bucket[color];
  if(!c) return '';
  return c[String(value)] || '';
}
function cardVisualHtml(c, widthPx, extraAttrs, noPreview){
  extraAttrs = extraAttrs || '';
  const hov = src => noPreview ? '' : `onmouseenter="showCardPreview(event,'${src}')" onmousemove="positionCardPreview(event)" onmouseleave="hideCardPreview()"`;
  const h = Math.round(widthPx*245/180);
  if(c.isFaceDown){
    if(CARD_IMAGES.back){
      return `<div class="artcard" style="width:${widthPx}px;">
        <img src="${CARD_IMAGES.back}" style="width:${widthPx}px;display:block;border-radius:5px;" ${hov(CARD_IMAGES.back)} ${extraAttrs}/>
      </div>`;
    }
    return `<div class="simplecard" style="width:${widthPx}px;height:${h}px;background:#2a2a2a;" ${extraAttrs}>
      <span class="simplecard-num">?</span>
      <span class="simplecard-tag">Face down</span>
    </div>`;
  }
  const src = cardImageSrc(c.color, c.printValue, c.isBigSplat ? 'bigSplat' : (c.isStarter ? 'starter' : null));
  if(!src){
    // Fallback for any missing art
    const bg = c.color ? COLOR_HEX[c.color] : '#777';
    return `<div class="simplecard" style="width:${widthPx}px;height:${h}px;background:${bg};" ${extraAttrs}>
      <span class="simplecard-num">${fmtVal(c.value)}</span>
      <span class="simplecard-tag">${c.isStarter?'Splat':(c.isBigSplat?'Big Splat':(c.text||''))}</span>
    </div>`;
  }
  return `<div class="artcard" style="width:${widthPx}px;">
    <img src="${src}" style="width:${widthPx}px;display:block;border-radius:5px;" ${hov(src)} ${extraAttrs}/>
    <span class="valbadge">${fmtVal(c.value)}</span>
  </div>`;
}
let lastPointerIsMouse = true;
window.addEventListener('pointerdown', e=>{ lastPointerIsMouse = e.pointerType==='mouse'; }, true);
function showCardPreview(evt, src){
  if(!src || !lastPointerIsMouse) return;
  const el = document.getElementById('card-preview');
  const img = document.getElementById('card-preview-img');
  img.src = src;
  el.style.display = 'block';
  positionCardPreview(evt);
}
function positionCardPreview(evt){
  const el = document.getElementById('card-preview');
  if(el.style.display==='none') return;
  const w = 190, h = Math.round(w*245/180);
  let x = evt.clientX + 24;
  let y = evt.clientY - h - 24;
  if(y < 8) y = evt.clientY + 24;
  if(x + w > window.innerWidth - 8) x = evt.clientX - w - 24;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}
function hideCardPreview(){
  document.getElementById('card-preview').style.display = 'none';
}
function stackHtml(player, color){
  const s = player.stacks[color];
  const n = s.length;
  const peek = 20, cardW = 66, cardH = Math.round(cardW*245/180);
  const pileHeight = cardH + Math.max(0,n-1)*peek;
  let html = `<div class="stack"><div class="shead" style="color:${COLOR_HEX[color]}">${COLOR_NAMES[color]}</div>`;
  html += `<div class="pile" style="height:${pileHeight}px;width:${cardW}px;">`;
  if(n===0){
    html += `<div class="pile-empty" style="width:${cardW}px;height:${cardH}px;">empty</div>`;
  } else {
    s.forEach((c,i)=>{
      const inner = cardVisualHtml(c, cardW, `title="${c.isFaceDown ? 'Face down' : fmtVal(c.value)}" onclick="onCardTap(${c.uid})"`);
      html += `<div class="pilecard ${i===n-1?'top':''}" style="bottom:${i*peek}px;z-index:${i};width:${cardW}px;">${inner}</div>`;
    });
  }
  html += `</div></div>`;
  return html;
}
function playerHtml(p){
  const mine = p.id===viewSeat();
  const tag = mine ? ' (you)' : p.remote ? (netSeatAway(p.id) ? ' <span class="net-away">(disconnected)</span>' : ' 🌐') : !p.isHuman ? ' 🤖' : '';
  let html = `<div class="player ${mine?'human':''}">`;
  html += `<div class="phead"><span class="pname">${escHtml(p.name)}${tag}</span><span class="ptotal">${p.total} pts</span></div>`;
  html += `<div class="stacks">` + COLORS.map(c=>stackHtml(p,c)).join('') + `</div>`;
  if(mine){
    html += `<div class="mudrow">Mud: ${p.mudHand.length}/${MUD_HAND_LIMIT} (in your hand below)</div>`;
  } else {
    html += `<div class="mudrow">Hand: ${p.hand.length} · Mud: ${p.mudHand.length}/${MUD_HAND_LIMIT}</div>`;
  }
  html += `</div>`;
  return html;
}
function scoreCardText(card){
  if(!card) return '';
  if(card.type==='majority'){
    const n = state.players.length;
    const tiers=[15,10,5];
    const used = tiers.slice(Math.max(0,3-(n-1)));
    return card.text + ` — payout tiers in play: [${used.join(', ')}]`;
  }
  return card.text;
}
// Pass token detail: which way give abilities and the draft pass go this
// round, and who that is for you. Hands pass the opposite way to gifts
// (see handFromOffset in the round loop).
function passTokenLinesHtml(){
  const n = state.players.length;
  const right = state.passDirection==='right';
  const nameOf = i => state.players[i] ? state.players[i].name : '';
  const v = viewSeat();
  const draftTo = right ? (v-1+n)%n : (v+1)%n;
  const give = state.giveBoth
    ? `Give abilities: ↔ both neighbours`
    : `Give abilities: ${right?'→ right':'← left'} (to ${nameOf(passNeighbourOf(v))})`;
  const draft = `Draft pass: ${right?'← left':'→ right'} (to ${nameOf(draftTo)})`;
  return `${give}<br>${draft}`;
}
function render(){
  if(state.simMode) return;
  if(net && net.role==='host') netScheduleBroadcast();
  const app = document.getElementById('app');
  let html = '';

  if(state.phase==='intro' && state.introOnline){
    const f = document.activeElement, fid = f && f.id, sel = fid && f.selectionStart;
    app.innerHTML = netSetupHtml();
    const g = fid && document.getElementById(fid);
    if(g){ g.focus(); try { g.setSelectionRange(sel, sel); } catch(e){} }
    return;
  }
  if(state.phase==='intro'){
    if(state.introNumAI==null){
      html += `
      <div class="hero">
        <h1 class="brand">🎨 Don't Get Splat</h1>
        <p>A paintball drafting prototype. Draft cards, build your colour stacks, and try to end each round with the lowest score. Choose how many AI opponents to play against.</p>
        <div class="opt-row">
          ${[1,2,3,4].map(n=>`<button class="opt-btn" onclick="onIntroPickCount(${n})">${n} AI opponent${n>1?'s':''}<small>${n+1} players total</small></button>`).join('')}
        </div>
        <div class="opt-row" style="margin-top:14px;">
          <button class="opt-btn" onclick="onNetOpen()">🌐 Play online with friends<small>Host a room or join one with a code</small></button>
        </div>
        ${TEST_BUILD ? `<div class="sim-panel">
          <div class="ai-setup-label">AI simulator</div>
          <p>Plays AI-only games at 2–5 players, with gifts going to one neighbour and then to both, and compares the two.</p>
          <label>Games per row <input type="number" min="10" step="50" value="${state.simGames||200}" oninput="onSimGamesChange(this.value)" ${state.simRunning?'disabled':''}/></label>
          <button class="opt-btn" onclick="runSimulation()" ${state.simRunning?'disabled':''}>Run simulation</button>
          <div id="sim-progress" class="status">${state.simRunning?'Simulating…':''}</div>
        </div>` : ''}
      </div>
      ${TEST_BUILD ? simResultsHtml() : ''}`;
    } else {
      html += `
      <div class="hero">
        <h1 class="brand">🎨 Don't Get Splat</h1>
        <p>Give each AI opponent a personality, or leave it on Random — the same personality can be picked more than once.</p>
        <div class="ai-setup-row">
          ${state.introAITypes.map((choice,i)=>`
            <div class="ai-setup-slot">
              <div class="ai-setup-label">AI ${i+1}</div>
              <select class="ai-setup-select" onchange="onIntroTypeChange(${i}, this.value)">
                <option value="random" ${choice==='random'?'selected':''}>Random</option>
                ${AI_TYPES.map(t=>`<option value="${t}" ${choice===t?'selected':''}>${AI_TYPE_LABELS[t]}</option>`).join('')}
              </select>
            </div>`).join('')}
        </div>
        <div class="ai-setup-row">
          <div class="ai-setup-slot">
            <div class="ai-setup-label">End-of-round cleanup</div>
            <select class="ai-setup-select" onchange="onIntroKeepChange(this.value)">
              <option value="1" ${state.keepTopCards===1?'selected':''}>Keep top 1 card</option>
              <option value="2" ${state.keepTopCards===2?'selected':''}>Keep top 2 cards</option>
            </select>
          </div>
          <div class="ai-setup-slot">
            <div class="ai-setup-label">Give abilities</div>
            <select class="ai-setup-select" onchange="onIntroGiveChange(this.value)">
              <option value="one" ${!state.newLineup?'selected':''}>One neighbour (pass token)</option>
              <option value="oneNew" ${state.newLineup&&!state.giveBoth?'selected':''}>One neighbour, new lineup (2/3 Splat, 4 Mud, 5 Big Splat)</option>
              <option value="both" ${state.giveBoth?'selected':''}>Both neighbours (2/3 Splat, 4 Mud, 5 Big Splat)</option>
            </select>
          </div>
          <div class="ai-setup-slot">
            <div class="ai-setup-label">6, 8, 9 and 10 cards</div>
            <select class="ai-setup-select" onchange="onIntroDestroy89Change(this.value)">
              <option value="flip" ${!state.destroy89?'selected':''}>Old cards (8 and 9 flip)</option>
              <option value="destroy" ${state.destroy89?'selected':''}>Printed (6: flip 2 tops, 8: 3 Splat/flipped, 9: 2 under, 10: 2 tops)</option>
            </select>
          </div>
        </div>
        <div class="opt-row">
          <button class="opt-btn" onclick="onIntroBack()">⟵ Back</button>
          <button class="opt-btn" onclick="onIntroStart()">Start Game</button>
        </div>
      </div>`;
    }
    app.innerHTML = html;
    return;
  }

  // top bar
  const scorecardsHtml = [state.roundScoreCard, state.roundScoreCard2].filter(Boolean).map(card=>
    `<div class="scorecard">${card.type==='majority' ? `<img src="${CARD_IMAGES.majority[card.singleColour ? 'single_colour' : (card.custom || card.color)]}"/>` : ''}<div><div class="label">Round Scoring</div><div class="text">${scoreCardText(card)}</div></div></div>`
  ).join('');
  const passTokenHtml = `<div class="scorecard" title="Flips every round">
    <img src="${PASS_TOKEN_IMG[state.passDirection]}" style="width:72px;height:72px;border-radius:50%;"/>
    <div><div class="label">Pass Token</div><div class="text">${passTokenLinesHtml()}</div></div>
  </div>`;
  html += `<div class="topbar">
    <div class="roundpill">Round ${state.round} / 3</div>
    ${passTokenHtml}
    ${scorecardsHtml}
    <div class="status">${escHtml(netStatusText())}</div>
    ${netChipHtml()}
  </div>`;

  // log
  html += `<div class="log"><h3>Action log</h3>` + state.log.slice(0,14).map(l=>`<div class="entry">${l}</div>`).join('') + `</div>`;

  if(state.phase==='roundSummary'){
    const rows = state.lastSummary.map(r=>`
      <tr>
        <td>${escHtml(r.player.name)}</td>
        <td>${r.base}</td>
        <td>${r.bonus>=0?'+':''}${r.bonus}</td>
        <td><strong>${r.total}</strong></td>
        <td style="font-size:.75rem;color:var(--sub)">${r.notes.join('; ')||'—'}</td>
      </tr>`).join('');
    html += `<div class="summary">
      <h3>Round ${state.round} results</h3>
      <table><tr><th>Player</th><th>Base</th><th>Bonus</th><th>Round total</th><th>Notes</th></tr>${rows}</table>
      ${net && net.role==='guest'
        ? `<p class="status">Waiting for ${escHtml(state.players[0].name)} to continue…</p>`
        : `<button class="continue-btn" onclick="onContinueClick()">${state.round<3? 'Continue to next round' : 'See final results'}</button>`}
    </div>`;
  }

  if(state.phase==='final'){
    const sorted = [...state.players].sort((a,b)=>a.total-b.total);
    html += `<div class="final"><h2>Final Results</h2>` +
      sorted.map((p,i)=>`<div class="rank ${i===0?'win':''}"><div class="n">${i===0?'🏆 ':''}${escHtml(p.name)}</div><div class="t">${p.total} pts</div>${p.mudPenalty? `<div style="font-size:.7rem;color:var(--sub);margin-top:4px;">(incl. -${p.mudPenalty} for ${p.mudHand.length} unused Mud)</div>` : ''}</div>`).join('') +
      (net && net.role==='guest'
        ? `<p class="status">Waiting for ${escHtml(state.players[0].name)} to start another game…</p></div>`
        : `<div><button class="restart-btn" onclick="restartGame()">Play again</button></div></div>`);
  }

  // boards
  html += `<div class="board-grid">` + state.players.map(playerHtml).join('') + `</div>`;

  app.innerHTML = html;

  // hand bar (human) + stored card slot
  if(state.phase!=='final'){
    const human = state.players[viewSeat()];
    const pickable = state.pickableUids || [];
    const clickable = !!state.pickResolve;
    let hb = `<div class="handbar">`;
    hb += `<span class="tag">${clickable? state.pickPrompt : 'Your hand'}:</span>`;
    if(clickable && !net) hb += `<button class="opt" style="margin-right:8px;" onclick="onBackClick()">↩ Back</button>`;
    if(clickable && state.pickKind==='mud') hb += `<button class="opt" style="margin-right:8px;" onclick="onPoolSkip()">Play normally ▶</button>`;
    if(human.hand.length===0 && !human.stored && human.mudHand.length===0) hb += `<span class="tag">empty</span>`;

    if(human.stored){
      const c = human.stored;
      const isPickable = pickable.includes(c.uid);
      const inner = cardVisualHtml(c, 76, `title="${fmtVal(c.value)}${c.text? ' — '+c.text : ''}" onclick="onCardTap(${c.uid})"`);
      hb += `<div class="cardwrap ${isPickable?'':'disabled'}" style="${isPickable?'':'opacity:.55;'}">${inner}<span class="pick-badge" style="background:#3f7aae;color:#fff;">S</span></div>
      <span class="tag" style="align-self:center;">|</span>`;
    }

    human.hand.forEach((c)=>{
      const isPickable = pickable.includes(c.uid);
      const inner = cardVisualHtml(c, 76, `title="${fmtVal(c.value)}${c.text? ' — '+c.text : ''}" onclick="onCardTap(${c.uid})"`);
      hb += `<div class="cardwrap" style="${isPickable?'':'opacity:.55;'}">${inner}</div>`;
    });

    if(human.mudHand.length>0){
      hb += `<span class="tag" style="align-self:center;">| Mud:</span>`;
      human.mudHand.forEach(m=>{
        const isPickable = pickable.includes(m.uid);
        const src = CARD_IMAGES.mud[m.key];
        hb += `<div class="cardwrap" style="${isPickable||!clickable?'':'opacity:.55;'}"><div class="artcard" style="width:76px;">
          <img src="${src}" style="width:76px;display:block;border-radius:5px;" title="Mud — ${m.t}" onmouseenter="showCardPreview(event,'${src}')" onmousemove="positionCardPreview(event)" onmouseleave="hideCardPreview()" onclick="onCardTap(${m.uid})"/>
        </div></div>`;
      });
    }
    hb += `</div>`;
    app.insertAdjacentHTML('beforeend', hb);
  }

  // modal
  if(state.modal){
    let m = `<div class="overlay"><div class="modal"><h3>${state.modal.title}</h3>`;
    state.modal.options.forEach((o,i)=>{ m += `<button class="opt" onclick="onModalChoiceIndex(${i})">${o.label}</button>`; });
    if(!net) m += `<button class="opt" style="opacity:.8;" onclick="onBackClick()">↩ Back</button>`;
    m += `</div></div>`;
    app.insertAdjacentHTML('beforeend', m);
  }
  if(state.cardZoom) app.insertAdjacentHTML('beforeend', cardZoomHtml());
}

render();
// Opening the page as dont_get_splat.html#sim=500 runs the simulator straight away.
if(TEST_BUILD && /^#sim/.test(location.hash)){
  const m = location.hash.match(/^#sim=(\d+)/);
  if(m) state.simGames = m[1];
  state.simQuick = /quick/.test(location.hash);
  state.simLastOnly = /last/.test(location.hash);
  state.destroy89 = !/old89/.test(location.hash);
  const k = location.hash.match(/keep=(\d)/);
  if(k) state.keepTopCards = parseInt(k[1],10);
  runSimulation();
}
</script>
</body>
</html>
