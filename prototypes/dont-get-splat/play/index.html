<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Don't Get Splat — Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#181820; --panel:#22222c; --panel2:#2b2b38; --ink:#f2f1f6; --sub:#a9a8b8;
    --red:#e6484a; --blue:#4d8fd6; --green:#3fb87f; --yellow:#e7c027;
    --purple:#9b6bd6;
    --mud:#8a5a2e; --accent:#ffd166;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;}
  h1,h2,h3,.brand{font-family:'Fredoka',sans-serif;}
  #app{max-width:1200px;margin:0 auto;padding:18px 18px 140px;}

  .hero{text-align:center;padding:60px 20px;}
  .hero h1{font-size:2.6rem;margin:0 0 6px;letter-spacing:.5px;}
  .hero p{color:var(--sub);max-width:560px;margin:0 auto 28px;line-height:1.5;}
  .opt-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .opt-btn{background:var(--panel2);border:2px solid transparent;color:var(--ink);padding:16px 22px;
    border-radius:14px;font-family:'Fredoka';font-size:1.1rem;cursor:pointer;transition:.15s;}
  .opt-btn:hover{border-color:var(--accent);transform:translateY(-2px);}
  .opt-btn small{display:block;color:var(--sub);font-family:'Nunito';font-weight:400;font-size:.75rem;margin-top:4px;}
  .ai-setup-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
  .ai-setup-slot{background:var(--panel2);border-radius:14px;padding:14px 16px;min-width:150px;text-align:left;}
  .ai-setup-label{font-family:'Fredoka';font-weight:600;font-size:.95rem;margin-bottom:8px;}
  .ai-setup-select{width:100%;background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:8px;
    padding:8px 10px;font-family:'Nunito';font-weight:700;font-size:.9rem;cursor:pointer;}
  .ai-setup-select:hover,.ai-setup-select:focus{border-color:var(--accent);outline:none;}

  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--panel);border-radius:14px;padding:14px 18px;margin-bottom:14px;}
  .roundpill{background:var(--panel2);padding:6px 14px;border-radius:999px;font-weight:800;}
  .scorecard{flex:1;min-width:220px;background:linear-gradient(135deg,#33334a,#26263a);
    border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
  .scorecard img{width:44px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.5);}
  .scorecard .label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--sub);}
  .scorecard .text{font-weight:700;}
  .status{font-style:italic;color:var(--accent);font-weight:600;}

  .board-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-bottom:20px;}
  @media (max-width:680px){ .board-grid{grid-template-columns:1fr;} }
  .player{background:var(--panel);border-radius:14px;padding:16px;border:2px solid transparent;}
  .player.human{border-color:var(--accent);}
  .player .phead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .player .pname{font-family:'Fredoka';font-weight:600;}
  .player .ptotal{font-weight:800;color:var(--accent);}
  .stacks{display:flex;gap:10px;}
  .stack{flex:1;min-width:0;background:var(--panel2);border-radius:8px;padding:5px;display:flex;flex-direction:column;align-items:center;}
  .stack .shead{font-size:.62rem;font-weight:800;text-transform:uppercase;color:var(--sub);margin-bottom:3px;}
  .pile{position:relative;}
  .pilecard{position:absolute;left:0;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.5);display:block;}
  .pilecard.top{outline:2px solid var(--accent);}
  .cardwrap{position:relative;display:inline-block;flex-shrink:0;}
  .artcard{position:relative;display:inline-block;}
  .simplecard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.5);border:2px dashed rgba(255,255,255,.55);}
  .simplecard-num{font-family:'Fredoka';font-weight:700;font-size:1.3rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .simplecard-tag{font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:2px;}
  .valbadge{position:absolute;top:-6px;left:-6px;background:#111;color:var(--accent);border:1.5px solid var(--accent);
    border-radius:999px;min-width:20px;height:20px;padding:0 4px;font-size:.68rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6);z-index:5;}
  .pick-badge{position:absolute;bottom:-6px;right:-6px;background:var(--accent);color:#222;border-radius:999px;
    width:20px;height:20px;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.6);z-index:5;}
  .pile-empty{display:flex;align-items:center;justify-content:center;font-size:.58rem;color:var(--sub);
    border:1px dashed rgba(255,255,255,.15);border-radius:6px;}
  .mudrow{margin-top:8px;font-size:.7rem;color:var(--sub);display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
  .mudthumb{width:34px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .mudchip{display:inline-block;background:var(--mud);color:#fff;border-radius:5px;padding:2px 6px;margin:2px 3px 0 0;font-size:.65rem;}

  .log{background:var(--panel);border-radius:14px;padding:12px 16px;margin-bottom:14px;max-height:180px;overflow-y:auto;}
  .log h3{margin:0 0 6px;font-size:.85rem;color:var(--sub);text-transform:uppercase;letter-spacing:1px;}
  .log .entry{font-size:.82rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);}

  .handbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--panel2);
    padding:10px 18px;display:flex;gap:10px;overflow-x:auto;align-items:center;}
  .handbar .tag{color:var(--sub);font-size:.8rem;white-space:nowrap;}
  .handcard{width:76px;border-radius:8px;cursor:pointer;transition:.12s;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .handcard:hover{transform:translateY(-4px);}
  .handcard.disabled{cursor:default;opacity:.55;}
  .handcard.selected{outline:3px solid var(--accent);}

  .overlay{position:fixed;inset:0;background:rgba(10,10,14,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel2);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5);}
  .modal h3{margin:0 0 14px;font-size:1.05rem;}
  .modal .opt{display:block;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:none;
    border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:'Nunito';font-weight:700;}
  .modal .opt:hover{background:var(--accent);color:#222;}

  .summary{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px;}
  .summary table{width:100%;border-collapse:collapse;font-size:.85rem;}
  .summary th,.summary td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);}
  .continue-btn,.restart-btn{background:var(--accent);color:#222;border:none;border-radius:10px;
    padding:12px 20px;font-family:'Fredoka';font-weight:600;font-size:1rem;cursor:pointer;margin-top:10px;}

  .final{text-align:center;padding:40px 10px;}
  .final .rank{display:inline-block;background:var(--panel);border-radius:14px;padding:14px 26px;margin:8px;min-width:160px;}
  .final .rank.win{border:2px solid var(--accent);}
  .final .rank .n{font-family:'Fredoka';font-size:1.3rem;}
  .final .rank .t{color:var(--accent);font-weight:800;font-size:1.4rem;}

  .sim-panel{margin:36px auto 0;max-width:560px;background:var(--panel2);border-radius:14px;padding:16px 18px;text-align:left;}
  .sim-panel p{margin:0 0 12px;font-size:.85rem;}
  .sim-panel label{font-size:.85rem;color:var(--sub);margin-right:12px;}
  .sim-panel input{width:80px;background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:8px;padding:6px 8px;font-weight:700;}
  .sim-panel .opt-btn{padding:10px 16px;font-size:.95rem;}
  .sim-panel .opt-btn[disabled]{opacity:.5;cursor:default;}
  .sim-panel .status{margin-top:8px;}
  .sim-scroll{overflow-x:auto;}
  .sim-results td,.sim-results th{white-space:nowrap;}
  .sim-results th{font-size:.72rem;white-space:normal;vertical-align:bottom;}

  .pile img,.pile .simplecard{cursor:pointer;}
  .zoom-modal{text-align:center;max-width:360px;}
  .zoom-modal .zoom-card{display:flex;justify-content:center;margin:0 auto 12px;}
  .zoom-modal .zoom-text{font-size:.95rem;margin:0 0 14px;}
  .zoom-modal .zoom-btns{display:flex;gap:10px;}
  .zoom-modal .zoom-btns button{flex:1;margin:0;text-align:center;padding:14px 10px;font-size:1rem;}
  .zoom-modal .zoom-btns .confirm{background:var(--accent);color:#222;}
  #card-preview{position:fixed;pointer-events:none;z-index:999;display:none;
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.65));}
  #card-preview img{display:block;width:190px;border-radius:12px;}

  .net-panel{margin:28px auto 0;max-width:560px;background:var(--panel2);border-radius:14px;padding:16px 18px;text-align:left;}
  .net-panel p{margin:0 0 12px;font-size:.85rem;color:var(--sub);}
  .net-input{font:inherit;font-weight:700;background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:8px;padding:8px 10px;}
  .net-input:focus{border-color:var(--accent);outline:none;}
  .net-code{font-family:'Fredoka';font-size:2rem;font-weight:700;letter-spacing:.25em;color:var(--accent);}
  .net-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0;}
  .net-seat{background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:700;}
  .net-status{font-size:.85rem;margin-top:8px;}
  .net-away{color:var(--accent);}
  .opt-btn[disabled]{opacity:.5;cursor:default;}
</style>
</head>
<body>
<div id="app"></div>
<div id="card-preview"><img id="card-preview-img" src=""/></div>

<script>
/* ============================= DATA ============================= */
const COLORS = ['red','blue','green','yellow'];
const COLOR_NAMES = {red:'Red',blue:'Blue',green:'Green',yellow:'Yellow',purple:'Purple'};
const COLOR_HEX = {red:'var(--red)',blue:'var(--blue)',green:'var(--green)',yellow:'var(--yellow)',purple:'var(--purple)'};
const COLOR_LETTER = {red:'R', blue:'B', green:'G', yellow:'Y'};
function pokerSrc(name){ return 'cards/poker/' + name + '.jpg'; }
function cardBackSrc(name){ return 'cards/cardBacks/' + name + '.jpg'; }
const CARD_IMAGES = (function(){
  const card = {}, starter = {}, bigSplat = {};
  Object.keys(COLOR_LETTER).forEach(function(color){
    const L = COLOR_LETTER[color];
    card[color] = {};
    for(let v=-5; v<=10; v++) card[color][String(v)] = pokerSrc(L+v);
    starter[color] = {};
    for(let v=1; v<=3; v++) starter[color][String(v)] = pokerSrc(L+'S'+v);
    bigSplat[color] = {};
    // Splat prints as 1/2/3, Big Splat as 4/5 — a clean split with no
    // value overlap between the two decks (Big Splat is always worth more
    // than any Splat card).
    for(let v=4; v<=5; v++) bigSplat[color][String(v)] = pokerSrc(L+'S'+v);
  });
  card.purple = {'2':pokerSrc('P2'), '3':pokerSrc('P3'), '4':pokerSrc('P4')};
  return {
    card: card, starter: starter, bigSplat: bigSplat,
    mud: {
      play_any: pokerSrc('Mud1'),
      use_under: pokerSrc('Mud2'),
      facedown_instead: pokerSrc('Mud3'),
      move2: pokerSrc('Mud4'),
      rearrange: pokerSrc('Mud5')
    },
    majority: {
      yellow: pokerSrc('ObjMaj2'),
      red: pokerSrc('ObjMaj3'),
      green: pokerSrc('ObjMaj4'),
      blue: pokerSrc('ObjMaj5'),
      single_colour: pokerSrc('ObjMaj6'),
      splat_facedown: pokerSrc('ObjMaj7'),
      big_stacks: pokerSrc('ObjMaj9')
    },
    back: cardBackSrc('backMain')
  };
})();


const VALUE_DEFS = [
  {v:-5, a:'gain_starter_2',            t:'Gain 2 Splat cards'},
  {v:-4, a:'gain_big_splat',            t:'Gain a Big Splat card'},
  {v:-3, a:'gift_mud',                  t:'Give your neighbour a Mud card'},
  {v:-2, a:'gain_starter',              t:'Gain a Splat card'},
  {v:-1, a:'gain_starter',              t:'Gain a Splat card'},
  {v:0,  a:'move_top',                  t:'Move the top card of one stack to another stack'},
  {v:1,  a:'rearrange',                 t:'Rearrange cards in this stack'},
  {v:2,  a:'give_starter_neighbours',   t:'Give your neighbour a Splat card'},
  {v:3,  a:'gain_mud',                  t:'Gain a Mud card'},
  {v:4,  a:'give_big_splat_neighbour',  t:'Give your neighbour a Big Splat card'},
  {v:5,  a:'give_starter_neighbours_2', t:'Give your neighbour 2 Splat cards'},
  {v:6,  a:'destroy_other',             t:'Destroy a card on top of a different stack'},
  {v:7,  a:'gain_mud_2',                t:'Gain 2 Mud cards'},
  {v:8,  a:'turn_facedown',             t:'Flip 2 other top cards (destroy any already flipped)'},
  {v:9,  a:'destroy_under',             t:'Flip the 2 cards under this (destroy any already flipped)'},
  {v:10, a:'destroy_facedown_starter',  t:'Destroy 3 splat or flipped cards'}
  // The "?" (chain_under) card remains pulled out — flagged as a likely
  // source of bugs. Re-add it here (with its ability/handling below) if it
  // comes back. Each colour is now 16 values (-5..10) instead of 15, matching
  // the updated poker-deck art (adds the new -5 "Gain 2 Splat cards" card).
];

// Purple cards are wild: they can be played into any stack (like a face-down
// marker's target choice) but keep 'purple' as their own colour/origin, so
// they break up an otherwise single-coloured stack. They have no ability of
// their own — only values 2-4 exist as purple art.
const PURPLE_VALUE_DEFS = VALUE_DEFS.filter(def=>[2,3,4].includes(def.v));
const PURPLE_COPIES_PER_VALUE = 3;

const MUD_TYPES = [
  {key:'rearrange',        t:'Rearrange cards in one stack before playing'},
  {key:'play_any',         t:'You may play a card into any paint stack'},
  {key:'use_under',        t:"Perform the action of the card under the card you're playing instead"},
  {key:'facedown_instead', t:'Play this card face down instead'},
  {key:'move2',            t:'Move 2 top cards before playing this card'}
];

const SCORING_SINGLE_COLOUR = {id:'m_single', type:'majority', color:null, singleColour:true, text:'Majority: Most single coloured stacks'};
const SCORING_SPLAT_FACEDOWN = {id:'m_splatfd', type:'majority', color:null, custom:'splat_facedown', text:'Majority: Most Splat and face down cards'};
const SCORING_BIG_STACKS = {id:'m_bigstacks', type:'majority', color:null, custom:'big_stacks', text:'Majority: Most stacks with 3 or more cards'};
let SCORING_MAJORITY, SCORING_POOL;
function recomputeScoringPool(){
  SCORING_MAJORITY = COLORS.map(c=>({id:'m_'+c, type:'majority', color:c, text:'Majority: Most '+COLOR_NAMES[c]}));
  SCORING_POOL = [...SCORING_MAJORITY, SCORING_SINGLE_COLOUR, SCORING_SPLAT_FACEDOWN, SCORING_BIG_STACKS];
}
recomputeScoringPool();

/* ============================= STATE ============================= */
// Test build: the -test copy of this page (dont_get_splat-test.html) shows
// the development features — per-AI personality picks, the cleanup / give /
// card-lineup options and the AI simulator. The normal build plays the
// defaults (keep top 1, one neighbour, printed cards) with random AIs.
const TEST_BUILD = /-test\.html$/i.test(decodeURIComponent(location.pathname));
let state = { phase:'intro', players:[], deck:[], discard:[], starterDeck:[], bigSplatDeck:[], scoringDeck:[], round:0,
  roundScoreCard:null, log:[], modal:null, pickResolve:null, pickableUids:[], pickPrompt:'', continueResolve:null,
  statusText:'', resolvingName:null, passDirectionBase:'right', passDirection:'right',
  introNumAI:null, introAITypes:[], keepTopCards:1, giveBoth:false, newLineup:false, aiDenial:true, aiGiftCredit:true, aiMudValue:true, aiMudOption:true, aiMudAll:true, aiCarryAll:true, aiMudChain:true, destroy89:true };
let modalResolver = null;
let uidCounter = 1;
function uid(){ return uidCounter++; }

/* ============================= UNDO ============================= */
// A "Back" button is offered at every human decision point during a turn.
// Clicking it unwinds back to the start of the current turn (before the
// first card was picked) and lets the human redo it from scratch.
class UndoSignal extends Error {}
function onBackClick(){
  state.cardZoom = null;
  if(state.pickResolve){
    const r = state.pickResolve; state.pickResolve = null; state.pickableUids = []; state.pickPrompt = '';
    r('__UNDO__');
  } else if(modalResolver){
    const r = modalResolver; modalResolver = null; state.modal = null;
    r('__UNDO__');
  }
}

/* ============================= HELPERS ============================= */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function delay(ms){ return state.simMode ? Promise.resolve() : new Promise(r=>setTimeout(r,ms)); }
function fmtVal(v){ return v>0? '+'+v : String(v); }
function cardShortLabel(c){ return (c.color? COLOR_NAMES[c.color] : 'Starter') + ' ' + fmtVal(c.value); }
function log(msg){ if(state.simMode) return; state.log.unshift(msg); if(state.log.length>150) state.log.pop(); render(); }

// Gift options. giveBoth: every give-ability hits each neighbour once (just
// the one opponent in a 2-player game) instead of the pass-token neighbour.
// newLineup: the 2-5 values are reworked — 2 and 3 give a Splat, 4 gains a
// Mud, 5 gives a Big Splat — with 2 starting Splats and 12 Big Splats.
// The "both neighbours" setup uses both; "one neighbour, new lineup" only
// the second.
const GIVE_BOTH_DEFS = {
  [-3]:{a:'gift_mud',                 t:'Give each neighbour a Mud card'},
  2:   {a:'give_starter_neighbours',  t:'Give each neighbour a Splat card'},
  3:   {a:'give_starter_neighbours',  t:'Give each neighbour a Splat card'},
  4:   {a:'gain_mud',                 t:'Gain a Mud card'},
  5:   {a:'give_big_splat_neighbour', t:'Give each neighbour a Big Splat card'}
};
// Printed 6-10 (default; destroy89 off = the old cards): 6 flips 2 other face-up top cards (already
// flipped ones are left alone), 8 destroys 3 Splat or flipped cards (the old
// 10), 9 destroys the 2 cards under it, and 10 destroys 2 other top cards.
const DESTROY_89_DEFS = {
  6:  {a:'flip_2_tops',              t:'Flip 2 other top cards (already flipped cards stay)'},
  8:  {a:'destroy_facedown_starter', t:'Destroy 3 Splat or flipped cards'},
  9:  {a:'destroy_under',            t:'Destroy the 2 cards under this'},
  10: {a:'turn_facedown',            t:'Destroy 2 other top cards'}
};
function effectiveDef(def){
  if(state.destroy89 && DESTROY_89_DEFS[def.v]) return DESTROY_89_DEFS[def.v];
  const d = state.newLineup && GIVE_BOTH_DEFS[def.v];
  if(!d) return def;
  return state.giveBoth ? d : {...d, t:d.t.replace('each neighbour','your neighbour')};
}
function buildMainDeck(){
  const deck=[];
  COLORS.forEach(color=>{
    VALUE_DEFS.forEach(printed=>{
      const def = effectiveDef(printed);
      deck.push({uid:uid(), color, origin:color, value:printed.v, printValue:printed.v, ability:def.a, text:def.t, isStarter:false, isFaceDown:false});
    });
  });
  PURPLE_VALUE_DEFS.forEach(def=>{
    for(let copy=0; copy<PURPLE_COPIES_PER_VALUE; copy++){
      deck.push({uid:uid(), color:'purple', origin:'purple', value:def.v, printValue:def.v, ability:null, text:'Can be played in any stack', isStarter:false, isFaceDown:false});
    }
  });
  return shuffle(deck);
}
function randomStarter(){
  if(state.starterDeck.length===0){
    const reclaimed = state.discard.filter(c=>c.isStarter);
    if(reclaimed.length>0){
      state.starterDeck = shuffle(reclaimed);
      state.discard = state.discard.filter(c=>!c.isStarter);
      if(state.simStats) state.simStats.splatReshuffles++;
      log('The Splat deck ran out — reshuffled from the discard pile.');
    }
  }
  if(state.starterDeck.length===0){
    // Fallback so play can't hard-crash if every starter is somehow tied up at once.
    if(state.simStats) state.simStats.splatEmpty++;
    log('No Splat cards available anywhere — this should be rare.');
    const vals=[1,2,3];
    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
    const v = vals[Math.floor(Math.random()*vals.length)];
    return {uid:uid(), color, origin:color, value:v, printValue:v, ability:null, text:'', isStarter:true, isFaceDown:false};
  }
  return state.starterDeck.pop();
}
function buildStarterDeck(){
  // Splat goes 1-3, Big Splat 4-5 — no value overlap between the two decks.
  // 3 copies each of 1 and 2, plus 2 copies of 3.
  const copyCounts = {1:3, 2:3, 3:2};
  const pool=[];
  COLORS.forEach(color=>{
    Object.keys(copyCounts).forEach(vStr=>{
      const v = Number(vStr);
      for(let copy=0; copy<copyCounts[v]; copy++){
        pool.push({uid:uid(), color, origin:color, value:v, printValue:v, ability:null, text:'', isStarter:true, isFaceDown:false});
      }
    });
  });
  return shuffle(pool);
}
function randomBigSplat(){
  if(state.bigSplatDeck.length===0){
    const reclaimed = state.discard.filter(c=>c.isBigSplat);
    if(reclaimed.length>0){
      state.bigSplatDeck = shuffle(reclaimed);
      state.discard = state.discard.filter(c=>!c.isBigSplat);
      if(state.simStats) state.simStats.bigReshuffles++;
      log('The Big Splat deck ran out — reshuffled from the discard pile.');
    }
  }
  if(state.bigSplatDeck.length===0){

      const usable = state.discard.filter(c=>c.color!==null && !c.isStarter && !c.isBigSplat);

const PASS_TOKEN_IMG = {right:'Pass1.png', left:'Pass2.png'};

/* ============================= AI PERSONALITIES =============================
   Five distinct AI archetypes, assigned to AI opponents at random each game
   (with replacement — a game can have two or more of the same type):
   - minimizer: baseline "simple AI" — plays whichever card leaves its total
     lowest once the card's ability resolves, passing its worst cards off
     to its neighbour. Only uses the simple Mud tricks (face down, play anywhere).
   - goal:      reads whichever majority goal card(s) are active this round
     and deliberately dodges them — since a count of 0 never earns a bad
     majority bonus, it drafts to keep its count toward each active goal at
     (or as close to) zero, even passing up otherwise-good cards to do it.
   - destroyer: flips/destroys as much as it can — plays whichever card
     would wipe the most points off its own board (6/8/9/10, or Mud's
     "use the ability underneath"), but only when there's a good target;
     otherwise plays low and keeps its destroy cards stored for later.
   - planner:   combo player. Simulates its own board for every "play this
     now, store that for next turn" pair (optionally spending a Mud card on
     either), so it finds chains like "yellow 8 flips two tops, then the
     stored yellow 9 flips the 8 itself" and carries them out.
   - chaos:     hoards and plays "give your neighbour a Splat/Big Splat card"
     cards above almost anything else, and uses Mud's "use the ability of
     the card underneath instead" to reactivate a give-ability already
     sitting in a stack for a second helping.

const AI_TYPES = ['minimizer','goal','destroyer','planner','chaos'];
const AI_TYPE_LABELS = {minimizer:'Minimizer', goal:'Goal Chaser', destroyer:'Destroyer', planner:'Planner', chaos:'Chaos'};
// Flipping is close enough to destroying (a flipped card scores 0) that the
// Destroyer chases the 8 and 9 as well.
const DESTROY_ABILITY_STRENGTH = {destroy_facedown_starter:10, destroy_under:9, turn_facedown:8, destroy_other:6, flip_2_tops:6};
// Give-to-neighbour abilities, ranked by how much chaos they cause — Big
// Splat and double-Splat gifts outweigh a single Splat, and gifting Mud
// (helpful, not harmful, to the recipient) is a distant last resort.
const GIVE_ABILITY_STRENGTH = {give_starter_neighbours_2:5, give_big_splat_neighbour:4, give_starter_neighbours:3, gift_mud:1};

// heavily any particular AI personality weighs it. A count of 0 toward a

// means growing a count we'd rather keep at (or near) zero.
function goalSafetyDelta(player, card){
  let delta = 0;

    if(goal.color){
      if(card.color===goal.color) delta -= 12;
    } else if(goal.custom==='splat_facedown'){
      const growsSplatCount = ['gain_starter','gain_starter_2','gain_big_splat', ...(state.destroy89 ? ['flip_2_tops'] : ['turn_facedown','destroy_under'])].includes(card.ability);
      if(growsSplatCount) delta -= 8;
    } else if(goal.custom==='big_stacks'){

      // stack over the threshold; stacks already at 3+ are counted anyway.
      // (Wild/purple cards have no stack of their own — skip them.)
      if(card.color && card.color!=='purple' && player.stacks[card.color].length===2) delta -= 6;

}
// How much weight the three non-Goal-Chaser personalities give goalSafetyDelta

// override what they're actually trying to do (minimize value, destroy,
// or set up a combo). The Goal Chaser ignores this entirely: for it, dodging
// goals IS the objective, at full strength (see GOAL_CHASER_EXPOSURE_WEIGHT).
const GOAL_AWARENESS_SECONDARY = 0.3;
// Where should the Goal Chaser dump a wild/forced card to best DEFUSE the
// active goal(s) — i.e. avoid growing whatever it's trying to keep at 0?
function goalChaserPlacement(player, colorOptions){
  const goalColors = activeGoalColors().filter(c=>colorOptions.includes(c));
  if(goalColors.length>0){
    const safe = colorOptions.filter(c=>!goalColors.includes(c));
    if(safe.length>0) return safe[0];
  }
  if(activeGoalCards().some(g=>g.custom==='big_stacks')){
    // Concentrate: a stack already at 3+ is counted anyway, so piling onto
    // it costs nothing; otherwise use the smallest stack so it stays under 3.
    const big = colorOptions.find(c=>player.stacks[c].length>=3);
    if(big) return big;
    let best=null, bestLen=Infinity;
    colorOptions.forEach(c=>{ const len=player.stacks[c].length; if(len<bestLen){ bestLen=len; best=c; } });
    return best;
  }
  if(activeGoalCards().some(g=>g.singleColour)){
    // Spend the wild card spoiling a stack that's still pure, aiming for a
    // "most single-coloured stacks" count of 0.
    const pure = colorOptions.filter(c=>{
      const s = player.stacks[c];
      if(s.length===0) return false;
      const origins = new Set(s.filter(cd=>cd.origin).map(cd=>cd.origin));
      return origins.size===1;
    });
    if(pure.length>0) return pure[0];
  }
  return null;
}
// Which active goal colour (if any) should be shrunk right now — used when
// the Goal Chaser gets to move or destroy a card and can reduce a count
// that's currently feeding a majority it's trying to dodge.
function targetGoalColor(player, colorOptions){
  const goalColors = activeGoalColors().filter(c=>colorOptions.includes(c));
  if(goalColors.length===0) return null;
  return goalColors.reduce((a,b)=> player.stacks[b].length>player.stacks[a].length ? b : a);
}
// Which colour should a point-conscious AI steer AWAY from so it doesn't
// hand itself a majority (and the bad points that come with it)?
function avoidGoalColor(player, colorOptions){
  const goalColors = activeGoalColors();
  const safe = colorOptions.filter(c=>!goalColors.includes(c));
  if(safe.length>0 && safe.length<colorOptions.length) return safe[0];
  return null;
}
// Best own stack to destroy the top card of (maximises value removed).
// goalAware adds a small tie-breaking nudge toward a stack that's currently

function bestDestroyColor(player, excludeColor, allowed, goalAware){
  const goalColors = goalAware ? activeGoalColors() : [];
  let best=null, bestScore=-Infinity;
  (allowed || COLORS).forEach(c=>{
    if(c===excludeColor) return;
    const s = player.stacks[c];
    if(s.length===0) return;
    const top = s[s.length-1];
    const v = top.isFaceDown? 0 : top.value;
    const score = v + (goalColors.includes(c) ? 3 : 0);

  });

const PLANNER_SPLAT_EV = 1.875;     // average Splat card (3×1, 3×2, 2×3)

const MUD_OPTION_VALUE = [3, 1.5, 0];
function gameTurnsLeftFraction(){
  const total = 3*TURNS_PER_ROUND;

const PLANNER_GIFT_VALUE = 0.5;     // share of a gift's value it counts as its own gain

const CARRY_SURVIVAL = 0.65;

// Carry-over value for the non-Planner personalities (only with aiCarryAll).

const PLANNER_MUD_KEYS = ['use_under','play_any','facedown_instead','rearrange','move2'];

// or the two moves to make — found by searching with the caller's scorer.
// (Only with aiMudAll on; before that no AI used these two Mud types.)
const MUD_CHOICE_KEYS = ['rearrange','move2'];

function topVal(card){ return card.isFaceDown ? 0 : card.value; }
function plannerCloneSim(sim){
  const stacks = {}; COLORS.forEach(c=>stacks[c]=sim.stacks[c].slice());

}
function simBase(player){
  return {stacks:player.stacks, virt:[], mud:player.mudHand.map(m=>m.key), gift:0, aiType:player.aiType};
}
// Flip target: the face-up top worth the most. Destroying an already

function plannerFlipPick(stacks, colorOptions){
  let best=null, bestGain=-Infinity;
  colorOptions.forEach(c=>{
    const s = stacks[c]; if(s.length===0) return;
    const gain = topVal(s[s.length-1]);
    if(gain>bestGain){ bestGain=gain; best=c; }

// Moving a card never changes the total, so just shrink a goal colour (or

function plannerMovePick(stacks){
  const srcs = COLORS.filter(c=>stacks[c].length>0);
  if(srcs.length===0) return null;
  const src = targetGoalColor({stacks}, srcs) || srcs.reduce((a,b)=> topVal(stacks[b][stacks[b].length-1]) > topVal(stacks[a][stacks[a].length-1]) ? b : a);

function plannerRearrangeOrder(stack){

// A Rearrange Mud card's two useful orders: 'low' leaves the cheapest card on

// flipped/destroyed, or sitting right under a 9 played onto it).
function mudRearrangeOrder(stack, order){

function applyMudArg(sim, mudKey, arg){

  arg.moves.forEach(m=>{
    if(st[m.src].length===0) return;

    st[m.src] = st[m.src].slice(0,-1);

function topMovesOn(stacks){

  return ms;

// Best choice for one Rearrange / Move 2 Mud card in a play option (argSlot

// move after each. Choices are made on the board as it will be at that point,
// i.e. after the first Mud card's action when choosing the second's.
function bestMudArg(sim, card, opt, argSlot, scoreFn){
  const mudKey = argSlot==='mudArg' ? opt.mud : opt.mud2;
  const board = plannerCloneSim(sim);
  if(argSlot==='mudArg2' && opt.mudArg) applyMudArg(board, opt.mud, opt.mudArg);
  const scoreArg = arg => { const s = plannerCloneSim(sim); plannerSimPlay(s, card, {...opt, [argSlot]:arg}); return scoreFn(s); };

  const consider = arg => { const score = scoreArg(arg); if(!best || score<best.score) best = {score, arg}; };

    const firsts = topMovesOn(board.stacks).map(m=>({m, score:scoreArg({moves:[m]})})).sort((a,b)=>a.score-b.score).slice(0,3);

function plannerSimAbility(sim, key, col){

    case 'gain_starter_2': sim.virt.push(PLANNER_SPLAT_EV, PLANNER_SPLAT_EV); break;
    case 'gain_big_splat': sim.virt.push(bigSplatEV()); break;
    case 'give_starter_neighbours': sim.gift += giveTargetCount()*PLANNER_SPLAT_EV; break;
    case 'give_starter_neighbours_2': sim.gift += giveTargetCount()*2*PLANNER_SPLAT_EV; break;
    case 'give_big_splat_neighbour': sim.gift += giveTargetCount()*bigSplatEV(); break;
    case 'gift_mud': if(state.aiMudValue) sim.gift -= giveTargetCount()*MUD_VALUE; break;
    case 'gain_mud': case 'gain_mud_2': {
      const n = key==='gain_mud' ? 1 : 2;

      break;
    }
    case 'rearrange': if(st[col].length>=2) st[col] = plannerRearrangeOrder(st[col]); break;
    case 'move_top': { const mv = plannerMovePick(st); if(mv) st[mv.dst].push(st[mv.src].pop()); break; }

    case 'flip_2_tops': {

        opts.splice(opts.indexOf(c),1);
      }
      break;
    }
    case 'turn_facedown': {
      const opts = COLORS.filter(x=>x!==col && st[x].length>0);
      for(let i=0;i<2 && opts.length>0;i++){
        const c = plannerFlipPick(st, opts);
        const s = st[c], top = s[s.length-1];
        if(top.isFaceDown || state.destroy89) s.pop(); else s[s.length-1] = {...top, isFaceDown:true};

    case 'destroy_under': {

        }));

// Simulate playing card with the play option opt: {target, mud, mudArg,
// mud2, mudArg2} — up to two Mud cards, applied in order.
function plannerSimPlay(sim, card, opt){
  const muds = [opt.mud, opt.mud2].filter(Boolean);
  muds.forEach(k=>sim.mud.splice(sim.mud.indexOf(k),1));
  if(opt.mudArg) applyMudArg(sim, opt.mud, opt.mudArg);
  if(opt.mudArg2) applyMudArg(sim, opt.mud2, opt.mudArg2);
  const free = card.color==='purple' || muds.includes('play_any') || muds.includes('facedown_instead');
  const col = free ? opt.target : card.color;
  const stack = sim.stacks[col];
  if(muds.includes('facedown_instead')){ stack.push({...card, isFaceDown:true}); return; }
  const under = stack.length>0 ? stack[stack.length-1] : null;
  const ability = muds.includes('use_under') ? (under && under.ability) || null : card.ability;

function plannerPlayOptions(sim, card, mudKeys = PLANNER_MUD_KEYS, scoreFn){
